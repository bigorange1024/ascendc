    kind: decision
    by: agent
    statement: "第一刀实验：fix-toy-encrypt-fsm-ntt1 仅验证 MIX CrossCore flag 1/3 在 SIM 可跑完"
    deps: [D-NEAR, F-NTT-FLAGS]
    status: inactive
    evidence: "已完成：F-TOY-NTT1-SIM-PASS；继任 D-EXP-GT-20260903-2"
    targets: [Q-TOY-NTT]

  - id: D-EXP-GT-20260903-2
