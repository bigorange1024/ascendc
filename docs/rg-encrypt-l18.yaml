    deps: [D-NEAR]
    status: active

  # ================= domain: rg-hygiene（图谱治理，服务 debug） =================
  - id: D-RG-DEBUG-ONLY
    domain: rg-hygiene
    kind: decision
    by: human
    statement: "图谱只沉淀直接服务 Encrypt/l18 卡死 debug 的知识；无关内容不进图"
    deps: [D-NEAR, F-HANG-SYNC]
    status: active
    targets: [Q-ULT]

  - id: D-RG-FAIL-MUST-KEEP
    domain: rg-hygiene
    kind: decision
    by: human
    statement: "失败实验与失败经验必须沉淀为 inactive/retracted 及对应失败教训节点，禁止只保留通过项"
    deps: [D-RG-DEBUG-ONLY]
