# 推理图谱 · Encrypt / l18_l19 卡死排查
# 用途：服务 debug 的可推翻知识 +「提假设 → 实验 → 反向审查」。
# 工具：thirdparty/reasoning-graph-skill/scripts/rg_{validate,audit,query,render}.py --yaml 本文件
# 准入：只收直接服务卡死/FSM/同步/定位的实现·验证·性能知识。
# 必收：失败实验与失败经验（inactive decision + 失败教训 inference）；禁止只堆「测过绿」。
# 禁入：方法论/组织叙事；CPU 孪生路径与 CPU 经验（本线以 SIM→NPU 为准，CPU 无参考价值）；
#       「为绿而绿」伤性能做法（逐步 GM 外搬、堆 Host launch 等）当作推荐知识。

version: 1
title: "ML-KEM Encrypt · l18_l19 卡死 · 推理图谱"

config:
  required_fields: [domain]
  id_prefix_by_kind: {fact: F, inference: J, decision: D, question: Q}
  fact_provenance_values: [observation, measurement, doc, env-api]
  inference_derivation_values: [deductive, defeasible]
  decision_by_values: [human, agent]
  require_repro_for_provenance: [measurement]

review:
  last_reviewed: "2026-09-03"
  note: "初始建图；尚未派独立 subagent 语义复评"

nodes:
  # ================= domain: goals =================
  - id: Q-ULT
    domain: goals
    kind: question
    title: "用户最终验收问题"
    statement: "NPU 实机上 Encrypt/Encaps 的 l18_l19 是否不再 SynchronizeStream 卡死，且输出与 golden/liboqs 一致？"
    deps: [F-HANG-SYNC, F-SIM-ENCRYPT-GREEN]
    status: open

  - id: D-NEAR
    domain: goals
    kind: decision
    by: human
    title: "当前阶段近目标"
    statement: "先在 ascendc-tests 建轻量 toy，模仿 Encrypt 任务链骨架（桩哈希+NTT/INTT/内积/encoding），不对算法正确性；以 SIM 跑完且快为验收，不以 CPU 为准"
    deps: [J-FULL-SIM-SLOW, J-TOY-ISOLATES-FSM]
    status: active
    targets: [Q-ULT, Q-EMPTY-TRACE, Q-TOY-NTT, Q-TOY-GATE-INTT, Q-TOY-FUSED-L18-SKEL]

  - id: D-EXP-GT-20260903-1
