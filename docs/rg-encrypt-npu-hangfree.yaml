  - id: D-layer-real-compute
    domain: plan
    kind: decision
    by: agent
    title: "层3：换入真 NTT/内积等（进行中 E04）"
    statement: "在骨架不挂前提下逐段换真积木；每段一目录；SIM 绿才上一段"
    deps: [F-e03-stage-skel-sim-pass, D-use-blocks]
    status: active
    targets: [Q-how-to-write]

  - id: D-layer-correct-encrypt
    domain: plan
    kind: decision
    by: agent
    title: "层4：拼正确 Encrypt（卡死点之后；暂缓）"
    statement: "知识足以支撑无卡死编排后再写真正 Encrypt；正确性对拍暂缓至挂因清楚（见 D-defer-correctness-until-hang）"
    deps: [D-layer-real-compute, D-goal, D-defer-correctness-until-hang]
    status: inactive
    evidence: "用户锁：找出卡死原因前不做正确性比对"
    targets: [Q-how-to-write]

  - id: Q-root-cause
    domain: cause
    kind: question
    title: "实机粘性挂的可操作根因？"
    statement: "何种可构造条件在 NPU 上充分导致 Encrypt 粘性挂，且能指导重写避免？"
    deps: [F-hang-l18, F-empty-trace, J-encrypt-specific, J-omit-set4-eq-sticky]
    status: open

  - id: Q-how-to-write
    domain: plan
    kind: question
    title: "如何重拼 Encrypt 使实机不挂？"
    statement: "从积木与握手层向上，哪条 DAG 路径能得到实机无卡死且正确的 Encrypt？"
    deps: [J-need-bottom-up-toys, D-layer-handshake]
    status: open

