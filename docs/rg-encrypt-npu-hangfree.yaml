# Encrypt 实机无卡死 · 推理图谱（新开，不与旧 hang 图强行合并）
# 知识库：docs/notes/Encrypt-实机无卡死-知识库.md
# 工具：thirdparty/reasoning-graph-skill-master/
# 主控独占写；实验未下令前只沉淀、不派发编码

version: 1
title: "Encrypt 实机无卡死 · DAG"

config:
  required_fields: [domain]
  id_prefix_by_kind: {fact: F, inference: J, decision: D, question: Q}
  fact_provenance_values: [observation, measurement, doc, env-api]
  inference_derivation_values: [deductive, defeasible]
  decision_by_values: [human, agent]
  require_repro_for_provenance: [measurement]

nodes:
  # ========== method：工作法 ==========
  - id: F-problem
    domain: verify
    kind: fact
    provenance: observation
    title: "核心问题：Encrypt 实机会卡死"
    statement: "Encrypt（含 Encaps 路径）在 NPU 上出现粘性卡死，需重拼实现达到无卡死且正确"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09 实机短报；用户锁定目标 2026-09-06"

  - id: D-goal
    domain: method
    kind: decision
    by: human
    title: "最终目标：Encrypt 实机无卡死且正确"
    statement: "NPU 上 Encrypt 跑完且与 golden/权威交叉一致；消除粘性卡死"
    deps: [F-problem]
    status: active
    targets: [Q-how-to-write, Q-root-cause]

  - id: D-roles
    domain: method
    kind: decision
    by: human
    title: "主控推理；Subagent 执行实验"
    statement: "主控拥有目标/知识库/图谱/实验设计与验收派发；Subagent 按目标+验收编码跑测回报；按职责分工不按后缀分工"
    deps: [D-goal]
    status: active

  - id: D-no-copy-encrypt
    domain: method
    kind: decision
    by: human
    title: "可读现 Encrypt；禁止照抄实现"
    statement: "允许阅读现有 Encrypt 与文档；禁止把现实现当模板搬进新代码；必须经实验与图谱自底向上重拼"
    deps: [D-goal]
    status: active

  - id: D-freeze-existing
    domain: method
    kind: decision
    by: human
    title: "已有代码全冻结只读"
    statement: "仓库内既有实现目录一律只读；新实验必须新目录"
    deps: [D-no-copy-encrypt]
    status: active

  - id: D-fail-first
    domain: method
    kind: decision
    by: human
    title: "失败实验知识一等公民"
    statement: "证伪与回退必须入库；禁止只堆成功路径"
    deps: [D-goal]
    status: active

  - id: D-sim-then-npu
    domain: method
    kind: decision
    by: human
    title: "SIM 穷尽后才整份上机"
    statement: "迭代关键仅 SIM；禁止零散请测；仅当 SIM 不可分且图谱标出缺口时写 NPU_SUITE+数字 TRACE"
    deps: [D-goal, D-fail-first]
    status: active

  - id: D-one-exp-one-dir
    domain: method
    kind: decision
    by: human
    title: "一实验一目录"
    statement: "每个实验对应 graph_tests/toys/ 或 enc_related/ 下独立目录，并挂到图谱节点"
    deps: [D-roles, D-freeze-existing]
    status: active

  - id: D-trace-digits
    domain: method
    kind: decision
    by: agent
    title: "上机只回报三位数字 TRACE"
    statement: "设备/Host 只打印三位十进制；对照表见知识库 §6；禁止长日志"
    deps: [D-sim-then-npu]
    status: active

  - id: D-kb-graph-loop
    domain: method
    kind: decision
    by: human
    title: "实验后必写知识库并刷图谱"
    statement: "每小实验：结果→知识库→刷新本 DAG→再选下一实验"
    deps: [D-roles, D-fail-first]
    status: active

  # ========== verify：实机/SIM 观测 ==========
  - id: F-hang-l18
    domain: verify
    kind: fact
    provenance: observation
    title: "实机可挂在 l18 launch/sync"
    statement: "Encrypt/Encaps 实机粘性挂时，Host 最后可见行为常为已打印 l18_l19 launch 文案且无 duration"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09-02..04 用户短报；知识库 N1/N5"

  - id: F-hang-elsewhere
    domain: verify
    kind: fact
    provenance: observation
    title: "实机亦可挂在 prep_ntt/ntt_y"
    statement: "同一粘性问题也可停在 prep_ntt 或 SPLIT 后的 ntt_y launch/sync"
    deps: []
    status: verified
    basis: experiment
    evidence: "旧 hang 图 F-hang-prep-ntt / F-hang-split-ntt-y；知识库 N1"

  - id: F-empty-trace
    domain: verify
    kind: fact
    provenance: observation
    title: "挂 l18 时 TRACE 常全空"
    statement: "实机挂在 l18 时设备 TRACE 槽位常全空，早期 AIV 标记不可见"
    deps: [F-hang-l18]
    status: verified
    basis: experiment
    evidence: "qa/2026-09-02；知识库 N2"

  - id: F-keygen-ok
    domain: verify
    kind: fact
    provenance: observation
    title: "KeyGen 未复现同类粘性挂"
    statement: "同环境下 KeyGen 多轮未出现 Encrypt 同类粘性卡死"
    deps: []
    status: verified
    basis: experiment
    evidence: "知识库 N3"

  - id: F-sim-baseline-green
    domain: verify
    kind: fact
    provenance: measurement
    title: "全量/热修 Encrypt 路径 SIM 可绿"
    statement: "Cloud SIM 上 Encaps/PKE Encrypt（含 Hostμ 热修）可对拍绿，不能复现实机粘性挂"
    deps: []
    status: verified
    basis: experiment
    evidence: "旧图 F-sim-pass-baseline / F-pke-encrypt-hostmu-sim-pass"
    repro: "stable encrypt/encaps：SIM_DIRECT=1 bash run.sh -r sim -v Ascend910B4"

  - id: F-omit-set4-sim124
    domain: verify
    kind: fact
    provenance: measurement
    title: "缺 SET(4) 时 SIM 必挂 124"
    statement: "L2 skipNtt 入口 AIC Wait(4) 且省略双 AIV SET(4) 时 SIM 计算段超时 124"
    deps: []
    status: verified
    basis: experiment
    evidence: "fix-encrypt-skel / clean 对照；知识库 §3 △"
    repro: "冻结目录只读复验 SKEL_OMIT_SET4=1"

  - id: F-set4-ok-sim
    domain: verify
    kind: fact
    provenance: measurement
    title: "SET(4) 可达则 skipNtt 骨架 SIM 绿"
    statement: "同骨架下正常双 AIV SET(4) 时 SIM 结束且 magic/trace 可检"
    deps: []
    status: verified
    basis: experiment
    evidence: "skel TASK-004；clean P0/P1a"
    repro: "只读复验：ascendc-tests/fix-encrypt-skel-mix-chain-toy 与 fix-encrypt-clean-hostmu-2launch；SIM_DIRECT=1 bash run.sh -r sim -v Ascend910B4"

  - id: F-blocks-ok
    domain: verify
    kind: fact
    provenance: observation
    title: "NTT/SHA3/内积探针多次无卡死问题"
    statement: "活跃 NTT、SHA3、内积探针多次测试无问题；卡死不归因于这些积木自身实现错误"
    deps: []
    status: verified
    basis: experiment
    evidence: "用户 2026-09-06 确认；知识库 §5"

  # ========== 证伪（失败优先）==========
  - id: J-only-l18
    domain: cause
    kind: inference
    derivation: defeasible
    title: "（证伪）充分条件=仅第二段 l18"
    statement: "实机粘性挂的充分条件仅为第二段 l18"
    deps: [F-hang-l18]
    status: retracted
    basis: experiment
    evidence: "F-hang-elsewhere"
    retracted_by: F-hang-elsewhere

  - id: J-only-dual-cube
    domain: cause
    kind: inference
    derivation: defeasible
    title: "（证伪）充分条件=同核双 Cube"
    statement: "充分条件为同核双 Cube"
    deps: [F-hang-l18]
    status: retracted
    basis: experiment
    evidence: "拆/加压仍挂或 stub 不挂；旧图 retracted"
    retracted_by: F-sim-baseline-green

  - id: J-launch-count
    domain: cause
    kind: inference
    derivation: defeasible
    title: "（证伪）充分条件=Host launch 次数"
    statement: "卡死主要由 Host launch 次数决定"
    deps: [F-hang-elsewhere]
    status: retracted
    basis: experiment
    evidence: "SPLIT 增 launch 仍挂"

  - id: J-gate-alone
    domain: cause
    kind: inference
    derivation: defeasible
    title: "（证伪）充分条件=仅 GATE/prep∈MIX"
    statement: "合法 GATE 或 prep∈MIX 单独即充分导致挂"
    deps: [F-set4-ok-sim]
    status: retracted
    basis: experiment
    evidence: "skel GATE/HEAVY SIM 绿"

  - id: J-flag13-alone-sim
    domain: cause
    kind: inference
    derivation: defeasible
    title: "（证伪）stub 下 MIX+1/3 充分 SIM 挂"
    statement: "轻量 stub 仅 MIX+CrossCore 1/3 即足以 SIM 挂死"
    deps: [F-set4-ok-sim]
    status: retracted
    basis: experiment
    evidence: "skel toy SIM 绿"

  - id: J-heavy-cube-sim
    domain: cause
    kind: inference
    derivation: defeasible
    title: "（证伪）stub 更大 Cube 充分 SIM 挂"
    statement: "仅放大/增多 Cube 即足以 SIM 挂"
    deps: [F-set4-ok-sim]
    status: retracted
    basis: experiment
    evidence: "HEAVY SIM 绿"

  - id: J-hostmu-sim-implies-npu
    domain: cause
    kind: inference
    derivation: defeasible
    title: "（证伪/禁止）Hostμ SIM 绿⇒可零散上机结案"
    statement: "Host 折 μ SIM 对拍绿即可请零散上机验证并结案"
    deps: [F-sim-baseline-green]
    status: retracted
    basis: experiment
    evidence: "用户 2026-09-04 纠偏；D-sim-then-npu"
    retracted_by: D-sim-then-npu

  - id: J-omit-set4-eq-sticky
    domain: cause
    kind: inference
    derivation: defeasible
    title: "（未证实）缺 SET(4) 即实机粘性根因"
    statement: "实机粘性挂的根因就是缺 SET(4)（与 SIM 124 同构）"
    deps: [F-omit-set4-sim124, F-empty-trace]
    status: unverified
    basis: experiment
    evidence: "SIM 充分造成挂；实机空 TRACE 相容但未钉死"

  # ========== 仍成立约束 / 积木 ==========
  - id: D-forbid-syncall-in-wait
    domain: impl
    kind: decision
    by: agent
    title: "禁 AIC Wait 中 SyncAll"
    statement: "AIC 仍在 CrossCore Wait 时不得 SyncAll"
    deps: [D-fail-first]
    status: active

  - id: D-softsync-follow
    domain: impl
    kind: decision
    by: agent
    title: "AIV 汇合只跟 SoftSyncArrive 定式"
    statement: "需要 AIV 汇合时只复用既有 SoftSyncArrive；禁止自造双向汇合"
    deps: [D-forbid-syncall-in-wait]
    status: active

  - id: D-host-mu-default
    domain: impl
    kind: decision
    by: agent
    title: "μ 默认 Host 折；设备禁 PrefixEmbedMu"
    statement: "新拼装默认 Host 折 μ；skipNtt 设备路径不写 PrefixEmbedMu"
    deps: [F-empty-trace, D-no-copy-encrypt]
    status: active

  - id: D-set4-invariant
    domain: impl
    kind: decision
    by: agent
    title: "Wait(4) 必有双 AIV SET(4) 可达"
    statement: "凡 AIC Wait(4) 入口，设计上必须保证双 AIV SET(4) 可达"
    deps: [F-omit-set4-sim124, F-set4-ok-sim]
    status: active

  - id: D-use-blocks
    domain: impl
    kind: decision
    by: human
    title: "拼装基座=已绿 NTT/SHA3/内积"
    statement: "重拼 Encrypt 时以已验证 NTT、SHA3、内积为积木，不从零重写这些核"
    deps: [F-blocks-ok, D-no-copy-encrypt]
    status: active

  - id: J-encrypt-specific
    domain: cause
    kind: inference
    derivation: defeasible
    title: "触发因素在 Encrypt 特有编排"
    statement: "KeyGen 不挂而 Encrypt 挂 ⇒ 根因在 Encrypt 特有阶段编排/握手交互，而非积木算子本身"
    deps: [F-keygen-ok, F-hang-l18, F-blocks-ok]
    status: verified
    basis: experiment
    evidence: "知识库 N3+§5"

  - id: J-sim-not-sticky
    domain: cause
    kind: inference
    derivation: defeasible
    title: "当前 SIM 不能复现粘性挂"
    statement: "现有全量与骨架 SIM 绿路径无法当作实机粘性挂的复现器；SIM 只证结构约束与可构造挂（如缺 SET）"
    deps: [F-sim-baseline-green, F-omit-set4-sim124]
    status: verified
    basis: experiment
    evidence: "知识库 §3；与 J-omit-set4-eq-sticky（未证实）正交"

  # ========== 向上：能力阶梯（待实验填充）==========
  - id: J-need-bottom-up-toys
    domain: plan
    kind: inference
    derivation: defeasible
    title: "须自底向上 toy 逼近可上机拼装"
    statement: "在不能照抄 Encrypt 且 SIM 不复现粘性的前提下，只能用分层 toy 证明握手/编排不变量，再加重计算与正确性"
    deps: [D-no-copy-encrypt, J-sim-not-sticky, J-encrypt-specific, D-sim-then-npu]
    status: verified
    basis: experiment
    evidence: "用户计划 2026-09-06；知识库 §7"

  - id: D-no-repeat-retracted
    domain: method
    kind: decision
    by: human
    title: "禁止复踩图谱已 retracted 路线"
    statement: "已证伪充分条件（仅双Cube/仅GATE/仅launch次数/stub仅1/3等）禁止再开发现型对照实验；只可作负面教材引用"
    deps: [D-fail-first, J-need-bottom-up-toys]
    status: active

  - id: D-short-experiments
    domain: method
    kind: decision
    by: human
    title: "单实验必须短；超时即止损改刀"
    statement: "派给 subagent 的单次实验墙钟宜≤30–40min；过长先停并反思复杂度/路线，禁止主控傻等"
    deps: [D-roles, D-kb-graph-loop]
    status: active

  - id: D-layer-handshake
    domain: plan
    kind: decision
    by: agent
    title: "层1握手：采纳冻结证据（不重做发现）"
    statement: "缺 SET⇒124 与 SET 可达⇒绿已由冻结 skel 证实并写入 F-omit-set4-sim124/F-set4-ok-sim；层1不再开发现实验，直接当拼装不变量"
    deps: [J-need-bottom-up-toys, D-set4-invariant, F-omit-set4-sim124, F-set4-ok-sim, D-no-repeat-retracted]
    status: active
    targets: [Q-how-to-write]

  - id: D-exp-e01
    domain: plan
    kind: decision
    by: agent
    title: "E01：新目录 2-launch+SET4+数字TRACE×8 轮"
    statement: "在 graph_tests/toys/toy-e01-2launch-set4-trace-repeat/ 新建（不改冻结码）：L1 stub + L2 Wait/SET(4)；Host 数字 TRACE；同进程连续 8 轮 SIM 全跑完；另做一次 OMIT_SET4⇒124 对照"
    deps: [D-layer-handshake, D-host-mu-default, D-trace-digits, D-one-exp-one-dir, D-short-experiments]
    status: inactive
    replaced_by: D-exp-e02
    evidence: "FEEDBACK-E01 PASS ~6min；8 轮绿；OMIT⇒124；artifacts/e01-*-sim.log"

  - id: F-e01-8round-sim-pass
    domain: verify
    kind: fact
    provenance: measurement
    title: "E01：2-launch+SET4+TRACE×8 轮 SIM 绿"
    statement: "toy-e01 同进程 8 轮 L1+L2 全完成；Host 100/101/110/111 各 8；OMIT_SET4⇒rc124"
    deps: []
    status: verified
    basis: experiment
    evidence: "graph_tests/_outbox/FEEDBACK-E01.md；/opt/cursor/artifacts/e01-default-sim.log"
    repro: "cd graph_tests/toys/toy-e01-2launch-set4-trace-repeat && SIM_DIRECT=1 bash run.sh -r sim -v Ascend910B4"

  - id: D-exp-e02
    domain: plan
    kind: decision
    by: agent
    title: "E02：SoftSyncArrive 后再 SET(4)"
    statement: "新目录 toy-e02-softsync-then-set4：双 AIV 先 SoftSyncArrive 再 SET(4)；默认 SIM 绿（≥3 轮）；可选对照去掉 SoftSync（仍绿则记非必要，非失败）"
    deps: [F-e01-8round-sim-pass, D-softsync-follow, D-set4-invariant, D-short-experiments, D-one-exp-one-dir]
    status: inactive
    replaced_by: D-exp-e03
    evidence: "FEEDBACK-E02 PASS ~5min；3 轮绿；OMIT_SOFTSYNC 仍绿"

  - id: F-e02-softsync-set4-sim-pass
    domain: verify
    kind: fact
    provenance: measurement
    title: "E02：SoftSync→SET4×3 轮 SIM 绿"
    statement: "toy-e02 默认 SoftSyncArrive 后 SET(4)，3 轮 2-launch SIM 全完成；设备 TRACE 见 SoftSync 后再 SET"
    deps: []
    status: verified
    basis: experiment
    evidence: "graph_tests/_outbox/FEEDBACK-E02.md；/opt/cursor/artifacts/e02-default-sim.log"
    repro: "cd graph_tests/toys/toy-e02-softsync-then-set4 && SIM_DIRECT=1 bash run.sh -r sim -v Ascend910B4"

  - id: J-softsync-optional-minimal-set4
    domain: sync
    kind: inference
    derivation: defeasible
    title: "极简 SET4 toy 上 SoftSync 非必要"
    statement: "在仅 Wait(4)/SET(4) 的极简 L2 骨架上，省略 SoftSyncArrive 仍可 SIM 绿；SoftSync 不是 SET4 放行的充分前置"
    deps: [F-e02-softsync-set4-sim-pass]
    status: verified
    basis: experiment
    evidence: "OMIT_SOFTSYNC=1 仍绿；FEEDBACK-E02 weaken；业务 fused 仍可保留 SoftSync"

  - id: D-exp-e03
    domain: plan
    kind: decision
    by: agent
    title: "E03：采样形态→代数形态 stub 阶段齐"
    statement: "新目录 toy-e03-stage-skel-2launch：L1 采样形态 stub 阶段（仅 TRACE 点，无真 SHAKE）；Host 可空操作 μ；L2 代数形态 stub（NTT/点积/INTT 仅 TRACE）+SET(4)；≥3 轮 SIM 跑完；不对齐 liboqs、不抄 Encrypt"
    deps: [F-e02-softsync-set4-sim-pass, D-host-mu-default, D-use-blocks, D-short-experiments, D-one-exp-one-dir]
    status: inactive
    replaced_by: D-exp-e04
    evidence: "FEEDBACK-E03 PASS ~4.5min；3 轮绿；阶段 TRACE 顺序可读"

  - id: F-e03-stage-skel-sim-pass
    domain: verify
    kind: fact
    provenance: measurement
    title: "E03：采样→代数 stub 骨架×3 轮 SIM 绿"
    statement: "toy-e03 同进程 3 轮：L1 采样 stub TRACE + Host μ 空操作 + L2 代数 stub + SET(4) 全完成"
    deps: []
    status: verified
    basis: experiment
    evidence: "graph_tests/_outbox/FEEDBACK-E03.md；/opt/cursor/artifacts/e03-default-sim.log"
    repro: "cd graph_tests/toys/toy-e03-stage-skel-2launch && SIM_DIRECT=1 bash run.sh -r sim -v Ascend910B4"

  - id: D-exp-e04
    domain: plan
    kind: decision
    by: agent
    title: "E04：骨架 L2 换入真 NTT 积木"
    statement: "新目录 toy-e04-skel-plus-real-ntt：在 E03 形态骨架上，将 L2 假 NTT 段换为只读参考 pass-merged-kyber-mix-ntt256 的真单 poly NTT（非抄 Encrypt）；保留 SET(4)；≥3 轮 SIM 跑完；正确性尽量对拍该积木 golden（时间不够则至少不挂+magic）"
    deps: [D-layer-real-compute, F-e03-stage-skel-sim-pass, D-use-blocks, D-short-experiments, D-one-exp-one-dir]
    status: inactive
    replaced_by: D-exp-e05
    evidence: "FEEDBACK-E04 PASS ~5min；3轮绿；ntt256 golden 0/256；≠Tag5T"
    targets: [Q-how-to-write]


  - id: F-e04-skel-real-ntt-sim-pass
    domain: verify
    kind: fact
    provenance: measurement
    title: "E04：骨架+真NTT×3轮 SIM绿且ntt256对拍"
    statement: "toy-e04 在 E03 形态骨架上 L2 换入真单 poly NTT（merged-kyber ntt256 自包含）；3 轮 SIM 不挂；golden diffs=0/256；该 golden ≠ F203 Tag5T"
    deps: []
