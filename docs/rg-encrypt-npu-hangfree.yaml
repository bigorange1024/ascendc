version: 1
title: "Encrypt 实机无卡死 · DAG v2"

config:
  required_fields: [domain]
  id_prefix_by_kind: {fact: F, inference: J, decision: D, question: Q}
  fact_provenance_values: [observation, measurement, doc, env-api]
  inference_derivation_values: [deductive, defeasible]
  decision_by_values: [human, agent]
  require_repro_for_provenance: [measurement]

nodes:
  - id: F-problem
    domain: verify
    kind: fact
    provenance: observation
    title: "Encrypt 实机会粘性卡死"
    statement: "Encrypt/Encaps 在 NPU 上出现 SynchronizeStream 粘性卡死，需重拼实现达到无卡死且正确"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09 实机短报；知识库 §2 N1–N6"

  - id: Q-root-cause
    domain: cause
    kind: question
    title: "实机粘性挂的可操作根因？"
    statement: "何种可构造条件在 NPU 上充分导致 Encrypt 粘性挂，且能指导重写避免？"
    deps: [F-problem, F-n7-suite-single-pass, F-sim-not-sticky, F-n9-encaps-l18-runtime-3min, F-n10-pollution-vs-cold]
    status: open

  - id: Q-how-to-write
    domain: plan
    kind: question
    title: "如何重拼 Encrypt 使实机不挂且正确？"
    statement: "在图谱+cannbot 约束下，自底向上哪条路径得到实机无卡死且正确的 Encrypt？（挂因问题由 D-goal/D-graph targets 瞄准 Q-root-cause，本节点不 deps question）"
    deps: [D-graph-and-cannbot, F-n7-suite-single-pass, J-suite-not-enough-for-root]
    status: open

  - id: D-goal
    domain: method
    kind: decision
    by: human
    title: "最终目标：实机无卡死且正确"
    statement: "NPU 上 Encrypt 跑完且最终与权威交叉一致；本阶段优先钉挂因"
    deps: [F-problem]
    status: active
    targets: [Q-root-cause, Q-how-to-write]

  - id: D-graph-and-cannbot
    domain: method
    kind: decision
    by: human
    title: "实验与写码必须图谱+cannbot 双开"
    statement: "每刀前遍历本图；写/改 AscendC 前按知识库 §0.1 打开 cannbot Skill（优先 sync-audit/crash-debug/api）；就地读 thirdparty/cannbot-skills，不整仓拷进 .cursor/skills"
    deps: [D-goal]
    status: active
    evidence: "用户 2026-09-07：从头刷新库图；此后实验写码充分使用图谱与 cannbot"
    targets: [Q-how-to-write, Q-root-cause]

  - id: D-roles
    domain: method
    kind: decision
    by: human
    title: "主控推理；Subagent 执行"
    statement: "主控维护库+图+派刀；Subagent 按验收编码跑测；按职责不分后缀"
    deps: [D-goal]
    status: active

  - id: D-no-copy-encrypt
    domain: method
    kind: decision
    by: human
    title: "禁抄现 Encrypt 实现"
    statement: "可读冻结 Encrypt；禁止当模板搬码；积木自底向上重拼"
    deps: [D-goal]
    status: active

  - id: D-freeze-existing
    domain: method
    kind: decision
    by: human
    title: "已有代码冻结只读"
    statement: "stable/pass 等一律只读；新实验新目录 graph_tests/toys/"
    deps: [D-no-copy-encrypt]
    status: active

  - id: D-fail-first
    domain: method
    kind: decision
    by: human
    title: "失败知识一等公民"
    statement: "证伪与回退必须入库；禁止只堆成功路径；retracted 禁复踩"
    deps: [D-goal]
    status: active

