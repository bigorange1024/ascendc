    title: "run.sh：KeyGen 默认不跳过重编，Encaps/Encrypt 默认跳过"
    statement: "PKE/KEM KeyGen 默认 SKIP_REBUILD=0（PKE 常 rm -rf build）；Encrypt/Encaps/Decaps 默认 SKIP=1+stamp。属构建策略不对称，可混淆对照，但 FORCE 后 Encaps 仍挂 → 非粘性根因"
    deps: []
    status: verified
    basis: stated
    evidence: "知识库 §2.2；各 run.sh *_SKIP_REBUILD 默认值"
    repro: "rg SKIP_REBUILD examples/stable/ml-kem/ml-kem-1024/*/run.sh"

  - id: J-keygen-safe-due-to-missing-encrypt-sync
    domain: cause
    kind: inference
    derivation: defeasible
    title: "KeyGen 不挂更可能因缺少 Encrypt 特有同步/MIX 组合"
    statement: "在排除构建偏置（统一 FORCE/SKIP）后，优先检验 H-K1/H-K2（GATE at_jp / SampleNTT∈MIX），而非负载轻重"
    deps: [F-keygen-lacks-encrypt-gate-fsm, F-build-skip-asymmetric-keygen-vs-encaps, F-hang-l18, J-sim-not-sticky]
    status: unverified
    basis: heuristic
    evidence: "知识库 §2.1–2.2"

  - id: D-await-npu-digit-report
    domain: plan
    kind: decision
    by: agent
    title: "等待实机数字 TRACE 回报（按 BRANCHING 推理）"
    statement: "用户按 RUNBOOK 跑 C0→C1→C2，手抄 REPORT_TEMPLATE；主控按 BRANCHING B0–B3 定下一刀；未回报前不派正确性/ByteDecode 刀"
    deps: [F-e16-npu-suite-sim-smoke-pass, D-defer-correctness-until-hang, D-trace-digits]
    status: active
    targets: [Q-root-cause]


  - id: D-layer-2launch-skel
    domain: plan
    kind: decision
    by: agent
    title: "层2：2-launch Encrypt 骨架 toy"
    statement: "sampling 形态+代数形态阶段齐全、算量可 stub；验收=2-launch 多次跑完"
    deps: [F-e03-stage-skel-sim-pass, D-host-mu-default, D-use-blocks]
