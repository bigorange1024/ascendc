# Encrypt 实机无卡死 · 推理图谱 v2（cannbot 刷新 · 2026-09-07）
# 知识库：docs/notes/Encrypt-实机无卡死-知识库.md
# 工具：thirdparty/reasoning-graph-skill-master/
# 工程层：thirdparty/cannbot-skills/

version: 1
title: "Encrypt 实机无卡死 · DAG v2"

config:
  required_fields: [domain]
  id_prefix_by_kind: {fact: F, inference: J, decision: D, question: Q}
  fact_provenance_values: [observation, measurement, doc, env-api]
  inference_derivation_values: [deductive, defeasible]
  decision_by_values: [human, agent]
  require_repro_for_provenance: [measurement]

nodes:
  - id: F-problem
    domain: verify
    kind: fact
    provenance: observation
    title: "Encrypt 实机会粘性卡死"
    statement: "Encrypt/Encaps 在 NPU 上出现 SynchronizeStream 粘性卡死，需重拼实现达到无卡死且正确"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09 实机短报；知识库 §2 N1–N6"

  - id: Q-root-cause
    domain: cause
    kind: question
    title: "实机粘性挂的可操作根因？"
    statement: "何种可构造条件在 NPU 上充分导致 Encrypt 粘性挂，且能指导重写避免？"
    deps: [F-problem, F-n7-suite-single-pass, F-sim-not-sticky]
    status: open

  - id: Q-how-to-write
    domain: plan
    kind: question
    title: "如何重拼 Encrypt 使实机不挂且正确？"
    statement: "在图谱+cannbot 约束下，自底向上哪条路径得到实机无卡死且正确的 Encrypt？（挂因问题由 D-goal/D-graph targets 瞄准 Q-root-cause，本节点不 deps question）"
    deps: [D-graph-and-cannbot, F-n7-suite-single-pass, J-suite-not-enough-for-root]
    status: open

  - id: D-goal
    domain: method
    kind: decision
    by: human
    title: "最终目标：实机无卡死且正确"
    statement: "NPU 上 Encrypt 跑完且最终与权威交叉一致；本阶段优先钉挂因"
    deps: [F-problem]
    status: active
    targets: [Q-root-cause, Q-how-to-write]

  - id: D-graph-and-cannbot
    domain: method
    kind: decision
    by: human
    title: "实验与写码必须图谱+cannbot 双开"
    statement: "每刀前遍历本图；写/改 AscendC 前按知识库 §0.1 打开 cannbot Skill（优先 sync-audit/crash-debug/api）；就地读 thirdparty/cannbot-skills，不整仓拷进 .cursor/skills"
    deps: [D-goal]
    status: active
    evidence: "用户 2026-09-07：从头刷新库图；此后实验写码充分使用图谱与 cannbot"
    targets: [Q-how-to-write, Q-root-cause]

  - id: D-roles
    domain: method
    kind: decision
    by: human
    title: "主控推理；Subagent 执行"
    statement: "主控维护库+图+派刀；Subagent 按验收编码跑测；按职责不分后缀"
    deps: [D-goal]
    status: active

  - id: D-no-copy-encrypt
    domain: method
    kind: decision
    by: human
    title: "禁抄现 Encrypt 实现"
    statement: "可读冻结 Encrypt；禁止当模板搬码；积木自底向上重拼"
    deps: [D-goal]
    status: active

  - id: D-freeze-existing
    domain: method
    kind: decision
    by: human
    title: "已有代码冻结只读"
    statement: "stable/pass 等一律只读；新实验新目录 graph_tests/toys/"
    deps: [D-no-copy-encrypt]
    status: active

  - id: D-fail-first
    domain: method
    kind: decision
    by: human
    title: "失败知识一等公民"
    statement: "证伪与回退必须入库；禁止只堆成功路径；retracted 禁复踩"
    deps: [D-goal]
    status: active

  - id: D-sim-then-npu
    domain: method
    kind: decision
    by: human
    title: "SIM 穷尽结构后再上机"
    statement: "SIM 能做尽做；整份 NPU 须用户授权（910B3 有时限）"
    deps: [D-goal]
    status: active

  - id: D-defer-correctness
    domain: method
    kind: decision
    by: human
    title: "正确性后置于挂因"
    statement: "ByteDecode/KAT/权威交叉在钉住粘性挂可操作根因之前不做"
    deps: [D-goal, F-n1-hang-after-launch]
    status: active
    targets: [Q-root-cause]

  - id: D-host-trace-only-npu
    domain: method
    kind: decision
    by: agent
    title: "NPU 挂因只认 Host 1xx"
    statement: "设备 AscendC::printf 常不可见；套件 TOY_NPU_HOST_ONLY；缺 200 且已有 111 记未粘性挂"
    deps: [F-n2-empty-device-trace, D-graph-and-cannbot]
    status: active
    targets: [Q-root-cause]

  - id: D-typein-feedback
    domain: method
    kind: decision
    by: human
    title: "上机反馈只打字"
    statement: "用户不能回传任何文件；只打 REPORT:/三位码"
    deps: [D-goal]
    status: active

  - id: F-cannbot-crosscore-rules
    domain: sync
    kind: fact
    provenance: doc
    title: "cannbot：CrossCore 配对与 flagId 规则"
    statement: "CrossCore Set/Wait 须路径可达且配对；flagId 0–15；禁与 Matmul 高阶 API 混用；SyncAll 不对称会死等（SYNC-03/04/07/08/12）"
    deps: []
    status: verified
    basis: stated
    evidence: "thirdparty/cannbot-skills/ops/ascendc-api-best-practices/references/api-crosscore-sync.md；ascendc-sync-audit/references/sync-checklist.md"
    repro: "ls thirdparty/cannbot-skills/ops/ascendc-sync-audit/references/sync-checklist.md"

  - id: F-cannbot-audit-mix-false-positive
    domain: sync
    kind: fact
    provenance: measurement
    title: "sync_audit 对单文件 MIX 易报 SYNC-03 同侧"
    statement: "E01/E13/E15 与只读 l18 均报 SYNC-03「同侧」高优；同文件 ASCEND_IS_AIC/AIV 分支下为候选假阳性，须人工确认，禁止据此自动改绿核"
    deps: [F-cannbot-crosscore-rules]
    status: verified
    basis: experiment
    evidence: "/opt/cursor/artifacts/sync-audit-e13.json；知识库 §3.3"
    repro: "python3 thirdparty/cannbot-skills/ops/ascendc-sync-audit/scripts/sync_audit.py graph_tests/toys/toy-e13-encrypt-shaped-glue/mmad_custom.cpp --check all --format json"

  - id: F-cannbot-deadlock-triage
    domain: sync
    kind: fact
    provenance: doc
    title: "cannbot 死等分诊树可用"
    statement: "卡死优先查 CrossCore 路径 Set 是否可达、Set/Wait 配对、残留 CrossCore、SyncAll 不对称、Wait 先于 Set"
    deps: [F-cannbot-crosscore-rules]
    status: verified
    basis: stated
    evidence: "thirdparty/cannbot-skills/ops/ascendc-sync-audit/workflows/deadlock-triage.md"
    repro: "test -f thirdparty/cannbot-skills/ops/ascendc-sync-audit/workflows/deadlock-triage.md"

  - id: F-n1-hang-after-launch
    domain: verify
    kind: fact
    provenance: observation
    title: "挂在 launch 文案后 Sync 未回"
    statement: "Host 已打印 launch l18/prep 后 aclrtSynchronizeStream 不返回"
    deps: [F-problem]
    status: verified
    basis: experiment
    evidence: "知识库 N1/N5"

  - id: F-n2-empty-device-trace
    domain: verify
    kind: fact
    provenance: observation
    title: "挂时设备 TRACE 常空；NPU printf 常不可见"
    statement: "粘性挂时设备 mark 常不可见；NPU 挂因取证以 Host 1xx 为准"
    deps: [F-n1-hang-after-launch]
    status: verified
    basis: experiment
    evidence: "知识库 N2"

  - id: F-n3-keygen-safe
    domain: cause
    kind: fact
    provenance: observation
    title: "KeyGen 未同类粘性挂"
    statement: "同卡 KeyGen 路径未表现 Encrypt 类粘性挂 → 偏 Encrypt 特有编排"
    deps: [F-problem]
    status: verified
    basis: experiment
    evidence: "知识库 N3 §2.1"

  - id: F-toys-sim-pass
    domain: verify
    kind: fact
    provenance: measurement
    title: "E01–E15 SIM 积木/粘合/Â2×2 绿"
    statement: "自底向上 toys 至 e15 全 Â SampleNTT；SampleNTT 须独立 launch（E14）"
    deps: []
    status: verified
    basis: experiment
    evidence: "graph_tests/toys/；知识库 §4"
    repro: "test -d graph_tests/toys/toy-e15-samplentt-a-full-2x2"

  - id: F-n7-suite-single-pass
    domain: verify
    kind: fact
    provenance: measurement
    title: "NPU_SUITE 单轮 C0–C2 全绿"
    statement: "2026-09-07 用户回报 C0/C1/C2 均 PASS last=111（Host-only）"
    deps: [F-toys-sim-pass, D-host-trace-only-npu]
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-07-NPU套件单轮全绿与RxN.md"
    repro: "cd graph_tests/npu_suite && bash run_all_npu.sh -v Ascend910B4"

  - id: F-sim-not-sticky
    domain: verify
    kind: fact
    provenance: measurement
    title: "SIM 不能复现粘性挂"
    statement: "E01–E15 与缺 SET 的可构造 SIM124 均不能等同实机粘性挂"
    deps: [F-toys-sim-pass]
    status: verified
    basis: experiment
    evidence: "知识库 §3.1；FEEDBACK-E01–E15"
    repro: "ls graph_tests/_outbox/FEEDBACK-E15.md"

  - id: F-omit-set4-sim-hang
    domain: sync
    kind: fact
    provenance: measurement
    title: "缺 SET(4) 在 SIM 可构造 124"
    statement: "AIC Wait(4) 而 AIV 不 SET → SIM timeout；真且有用，≠ 实机粘性充分条件"
    deps: [F-cannbot-crosscore-rules]
    status: verified
    basis: experiment
    evidence: "冻结 skel / E01 OMIT；知识库 §3.1"
    repro: "grep -n OMIT_SET4 graph_tests/toys/toy-e01-2launch-set4-trace-repeat/run.sh"

  - id: F-samplentt-own-launch
    domain: impl
    kind: fact
    provenance: measurement
    title: "SampleNTT 须独立 launch/phase"
    statement: "与真链同 MIX 嵌入 SampleNTT 可致 SIM 挂/TPipe 争用；E14 起独立 phase"
    deps: [F-toys-sim-pass]
    status: verified
    basis: experiment
    evidence: "FEEDBACK-E14；知识库 §4"
    repro: "test -f graph_tests/_outbox/FEEDBACK-E14.md"

  - id: F-fail-first-history
    domain: cause
    kind: fact
    provenance: observation
    title: "历史证伪清单已入库"
    statement: "见知识库 §3.1 ✗ 行与旧 hang 图 retracted 节点"
    deps: []
    status: verified
    basis: stated
    evidence: "docs/notes/Encrypt-实机无卡死-知识库.md §3.1"

  - id: J-suite-not-enough-for-root
    domain: cause
    kind: inference
    derivation: defeasible
    title: "套件单轮绿 ⇒ 挂因在多轮或 ENCRYPT-GAP"
    statement: "N7 表明套件覆盖结构单轮不粘性；根因候选为 R×N 粘性或未覆盖的 Encrypt 特有同步/编排"
    deps: [F-n7-suite-single-pass, F-sim-not-sticky, F-n1-hang-after-launch]
    status: unverified
    basis: heuristic
    evidence: "BRANCHING B3；知识库 §6"

  - id: J-use-cannbot-on-gap
    domain: plan
    kind: inference
    derivation: defeasible
    title: "ENCRYPT-GAP 刀必须先 cannbot 审计"
    statement: "对照只读 l18 与新刀源码时，先 sync_audit+deadlock-triage，再单因子改同步/编排"
    deps: [J-suite-not-enough-for-root, F-cannbot-deadlock-triage, D-graph-and-cannbot]
    status: unverified
    basis: heuristic
    evidence: "知识库 §0.1 §3.2"

  - id: J-retracted-sufficiency
    domain: cause
    kind: inference
    derivation: defeasible
    title: "若干充分条件已证伪"
    statement: "仅双 Cube/仅 GATE/仅 launch 次数/仅 stub flag1/3 等不足以解释粘性挂；禁复踩"
    deps: [F-fail-first-history]
    status: verified
    basis: experiment
    evidence: "知识库 §3.1"

  - id: D-next-rxn-or-gap
    domain: plan
    kind: decision
    by: agent
    title: "下一刀：授权则 R×N；否则 ENCRYPT-GAP 短刀"
    statement: "用户授权 910B3 → run_rxn C2×7；无卡 → 按 J-use-cannbot-on-gap 开单因子结构 toy（禁正确性、禁抄码）"
    deps: [J-suite-not-enough-for-root, J-use-cannbot-on-gap, D-sim-then-npu, D-defer-correctness, D-typein-feedback]
    status: active
    targets: [Q-root-cause]

  - id: D-host-mu-default
    domain: impl
    kind: decision
    by: human
    title: "μ 默认 Host 折"
    statement: "设备 skipNtt 禁 PrefixEmbedMu；μ 由 Host 写入"
    deps: [D-no-copy-encrypt]
    status: active

  - id: D-no-syncall-in-wait
    domain: sync
    kind: decision
    by: agent
    title: "禁 AIC Wait 中 SyncAll"
    statement: "与 cannbot SYNC-12 / 本仓历史禁令一致"
    deps: [F-cannbot-crosscore-rules, D-graph-and-cannbot]
    status: active

changelog:
  - date: "2026-09-07"
    change: |
      v2 从头刷新：压缩 E01–E16 台账为 F-toys-sim-pass；
      升格 D-graph-and-cannbot；纳入 cannbot CrossCore/审计假阳性事实；
      下一刀 D-next-rxn-or-gap（R×N | ENCRYPT-GAP）。
