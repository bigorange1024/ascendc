# 推理图谱：ML-KEM PKE Decrypt 卡死排查（与 Encaps hang、Decaps K=131 分离）
# 工具：thirdparty/reasoning-graph-skill-master/
# 主控独占写；subagent 只读参考（除非任务明示允许改指定节点）
# 入库门禁：只收服务 Decrypt 卡死 debug 的断言；失败实验一等公民；
#   禁止把「严重伤效率/性能却只保 correctness」的反模式当推荐知识沉淀；
#   最终 NPU、迭代 SIM；不沉淀 CPU 孪生经验
# 正交：K 错见 docs/rg-kem-decrypt-k131.yaml；Encaps 粘性见 docs/rg-kem-encrypt-hang.yaml

version: 1
title: "ML-KEM Decrypt 卡死 · 推理图谱"

review:
  last_reviewed: "2026-09-03"
  note: "T0–T4 齐：缺 SET(4)/R2 缺 SET(4)→124；空 while/脏 softSync 非 SIM hang；可选下一刀 TRACE 标记"

config:
  required_fields: [domain]
  id_prefix_by_kind: {fact: F, inference: J, decision: D, question: Q}
  fact_provenance_values: [observation, measurement, doc, env-api]
  inference_derivation_values: [deductive, defeasible]
  decision_by_values: [human, agent]
  require_repro_for_provenance: [measurement]

nodes:
  # ================= domain: method =================
  - id: D-admit-debug-only
    domain: method
    kind: decision
    by: human
    title: "图谱只沉淀服务 Decrypt 卡死 debug 的知识"
    statement: "节点必须能直接支撑 PKE Decrypt 卡死的定位、证伪或修复判断；K=131 对拍错、Encaps 粘性细节、闲聊/目录索引一律不入库（可 references 他图）"
    deps: [D-goal-npu]
    status: active

  - id: D-admit-failures-first-class
    domain: method
    kind: decision
    by: human
    title: "失败实验与失败经验必须一等公民入库"
    statement: "证伪的推论标 retracted、回退的方案标 inactive，并写清证据与 retracted_by；禁止只沉淀通过测试的成功路径"
    deps: [D-admit-debug-only]
    status: active

  - id: D-reject-correctness-antipattern
    domain: method
    kind: decision
    by: human
    title: "禁止把严重伤效率性能的 correctness 捷径当推荐知识"
    statement: "逐步外搬 GM、为正确性滥增 Host launch、标量碎写等严重伤开发效率或 NPU 性能的做法，即使偶发对拍绿也不得标为 active 推荐解；仅可作为失败/对照经验以 inactive 或 retracted 留痕"
    deps: [D-admit-debug-only]
    status: active

  - id: D-verify-sim-for-npu
    domain: method
    kind: decision
    by: human
    title: "本排查线以 SIM 为关键代理；不沉淀 CPU 经验"
    statement: "最终验收在 NPU 实机；迭代验证以 SIM 为准。CPU 孪生路径与本卡死无关且无参考价值，不跑作门禁、不写入图谱"
    deps: [D-goal-npu, D-admit-debug-only]
    status: active

  - id: D-sim-enough-before-npu
    domain: method
    kind: decision
    by: human
    title: "SIM 实验充分后再请用户上实机"
    statement: "toy/假说须在 SIM 上充分验证并沉入本图后再请用户拷到 NPU；用户可代跑但无法随时上机；禁止空图谱把上机当第一刀"
    deps: [D-verify-sim-for-npu, D-goal-npu, D-near-toy]
    status: active

  - id: D-solo-subagent-timebox
    domain: method
    kind: decision
    by: human
    title: "同时仅一个 subagent；任务必须时限止损"
    statement: "同时最多一个干活 subagent；禁止并行 SIM；每 TASK 必填 deadline_min/max_retries；超时卡死死循环则 ABORT 并沉淀失败"
    deps: [D-main-subagent, D-admit-failures-first-class]
    status: active

  - id: D-no-autonomous-push
    domain: method
    kind: decision
    by: human
    title: "subagent 不得自主 git 推送"
    statement: "干活 subagent 不得 commit 或 push；主控按平台/用户当次授权处理仓库写远程"
    deps: [D-main-subagent]
    status: active

  - id: D-orthogonal-k131
    domain: method
    kind: decision
    by: human
    title: "与 Decaps K=131 分图谱"
    statement: "本图只管 Decrypt/PKE fused 运行卡死；K max≈131（跑完但密钥错）走 rg-kem-decrypt-k131.yaml，禁止把 hang 与 K 错并成一张图交差"
    deps: [D-goal-npu]
    status: active

  - id: D-orthogonal-encrypt-hang
    domain: method
    kind: decision
    by: human
    title: "与 Encaps 粘性分图谱、可借机制"
    statement: "Encaps hang 的 Wait(4)/缺 SET(4) 等机制可 references 引用，但 Decrypt fused 有 SoftSync 两槽与两轮 Cube GATE，必须单独 toy 沉积；禁止把 Encaps 热修当 Decrypt hang 的充分解"
    deps: [D-goal-npu]
    status: active

  - id: D-goal-npu
    domain: method
    kind: decision
    by: human
    title: "最终目标：实机 PKE Decrypt 不卡死且 m 对拍"
    statement: "NPU 实机上 stable-fips203-mlkem-pke-decrypt-k4 单 MIX fused 能跑完，m 与 golden 一致；不把上机当无 toy 证据的第一刀"
    deps: [F-npu-hang-after-print, F-cloud-sim-fused-pass]
    status: active
    targets: [Q-root-cause]

  - id: D-near-toy
    domain: method
    kind: decision
    by: human
    title: "近程：轻量 toy 模仿 Decrypt fused 握手链"
    statement: "在 ascendc-tests 新建轻量探针，模仿 PKE Decrypt fused 同步骨架（SoftSync slot0/1 + GATE 4/8 两轮 + stub NTT/INTT Cube），去掉真实 unpack/dot/哈希；不对算法正确性；须在 SIM 上能合法结束，并能用故障注入复现挂死"
    deps: [D-goal-npu, D-reject-correctness-antipattern, D-verify-sim-for-npu]
    status: active
    targets: [Q-toy-repro]

  - id: D-graph-tests
    domain: method
    kind: decision
    by: human
    title: "授权 graph_tests 验证本图推测"
    statement: "在 graph_tests/ 下为本图假说写小实验；主控设计，subagent 实现与跑测"
    deps: [D-near-toy]
    status: active

  - id: D-main-subagent
    domain: method
    kind: decision
    by: human
    title: "主控管图谱与实验设计；subagent 只干活"
    statement: "主控负责目标、图谱沉淀/刷新/推理、实验设计与结果分析；实现代码由 subagent 按任务模板执行并按反馈模板回报；subagent 默认可读图谱、默认不写图谱"
    deps: [D-graph-tests, D-admit-failures-first-class]
    status: active

  - id: D-forbid-syncall-while-wait
    domain: impl
    kind: decision
    by: agent
    title: "禁止 AIC Wait 中 SyncAll"
    statement: "后续实验禁止在 AIC 仍 CrossCore Wait 时调用 SyncAll；汇合须遵循 Decrypt SoftSyncArrive 定式或合法 GATE"
    deps: [F-syncall-after-aic, D-admit-failures-first-class]
    status: active

  - id: D-softsync-is-prod-not-homemade
    domain: impl
    kind: decision
    by: agent
    title: "SoftSync 跟生产 SoftSyncArrive 定式"
    statement: "Decrypt fused 生产路径使用 AIV0 写哨兵、AIV1 自旋的 SoftSyncArrive；toy 必须复现该单向定式，禁止再发明双向汇合或 AIC Wait 中 SyncAll"
    deps: [F-softsync-two-slots, D-forbid-syncall-while-wait]
    status: active

  - id: D-antipattern-frequent-launch
    domain: impl
    kind: decision
    by: agent
    title: "（禁止当正解）靠滥增 Host launch 躲卡死"
    statement: "把 Decrypt fused 切成更多 Host launch 当作推荐修法"
    deps: [D-reject-correctness-antipattern]
    status: inactive
    evidence: "Encaps SPLIT 3-launch 仍粘；滥 launch 伤性能；本线仅作负面对照"

  - id: D-antipattern-scalar-gm
    domain: impl
    kind: decision
    by: agent
    title: "（禁止当正解）逐步标量外搬 GM 当同步捷径"
    statement: "每做一点计算就标量写 GM / 碎搬一轮来冒充同步或保正确"
    deps: [D-reject-correctness-antipattern]
    status: inactive
    evidence: "工程通则；即使对拍绿也不得沉淀为推荐解"

  # ================= domain: verify（观测） =================
  - id: F-hang-after-gen-data-print
    domain: verify
    kind: fact
    provenance: observation
    title: "实机卡在 gen_data 生产输入提示之后"
    statement: "用户报告 Decrypt 卡死发生在打印「prod input = dk_pke + c + lut_* only; fixture under output/_gen_fixture/」之后；该文案来自 PKE Decrypt gen_data，不是 KEM Decaps K 路径"
    deps: []
    status: verified
    basis: experiment
    evidence: "用户 2026-09-03；stable-fips203-mlkem-pke-decrypt-k4/scripts/gen_data.py"

  - id: F-npu-hang-after-print
    domain: verify
    kind: fact
    provenance: observation
    title: "卡死发生在 Host 已生成生产输入之后、kernel 未跑完"
    statement: "gen_data 已成功写出 dk_pke/c/lut 后进程不再返回成功对拍；与 Encaps「launch 打印后无 npu_launch duration」同类，指向设备 MIX 未返回，而非 golden 算错"
    deps: [F-hang-after-gen-data-print]
    status: verified
    basis: experiment
    evidence: "用户 2026-09-03；对照 Encaps hang 的 Host 打印语义"

  - id: F-cloud-sim-fused-pass
    domain: verify
    kind: fact
    provenance: observation
    title: "Cloud 上 PKE Decrypt fused SIM 曾对拍绿"
    statement: "stable-fips203-mlkem-pke-decrypt-k4 全量 fused 在 Cloud SIM 可跑完且 m 对拍（历史 tick 约 2.8e5 量级）；故 hang 目前按 NPU-only 对待，toy 须在 SIM 上复现握手级挂死机制而非指望全量 SIM 自己挂"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/TODO.md Alg.15 T15a SIM tick≈283290；交付记录 m 对拍"

  - id: F-case-is-pke-decrypt-fused
    domain: verify
    kind: fact
    provenance: doc
    title: "生产用例是 PKE Decrypt 单 kernel fused"
    statement: "挂点用例为 examples/stable/.../stable-fips203-mlkem-pke-decrypt-k4，入口 f203_decrypt_device_fused，Host 单次 MIX launch；不是 kem-decaps-k4 的 2-launch Phase-D/E"
    deps: []
    status: verified
    basis: spec
    evidence: "main_decrypt.cpp / main_decrypt_g4_run.cpp / compute/g4_full/f203_decrypt_device_fused_entry.cpp"

  - id: F-no-device-trace
    domain: verify
    kind: fact
    provenance: doc
    title: "（已证伪）PKE Decrypt fused 无 Encaps 级 TRACE"
    statement: "历史断言「fused 无 TRACE」；2026-09-04 已加独立 traceGm + F203_DECRYPT_TRACE，本断言不再成立"
    deps: [F-case-is-pke-decrypt-fused]
    status: retracted
    basis: experiment
    evidence: "F-decrypt-trace-sim-pass"
    retracted_by: F-decrypt-trace-sim-pass

  # ================= domain: impl（生产握手） =================
  - id: F-softsync-two-slots
    domain: impl
    kind: fact
    provenance: doc
    title: "softSyncGm int32[2]：slot0=prep，slot1=su_dot+pad"
    statement: "AIV0 把 s[slot]=1；AIV1 while(s[slot]==0) 自旋；Host 启动前必须清零，否则 AIV1 可能死等或误放行"
    deps: []
    status: verified
    basis: spec
    evidence: "f203_decrypt_device_fused_entry.cpp SoftSyncArrive；main_decrypt_g4_run.cpp kSoftSyncBytes 清零注释"

  - id: F-host-zeros-softsync
    domain: impl
    kind: fact
    provenance: doc
    title: "Host 必须在 launch 前把 softSyncGm 清零"
    statement: "main_decrypt_g4_run 在 CPU 孪生 memset、在 NPU 路径 aclrtMemcpy 全 0；注释写明否则 AIV1 自旋死等"
    deps: [F-softsync-two-slots]
    status: verified
    basis: spec
    evidence: "main_decrypt_g4_run.cpp kSoftSyncBytes / zeros H2D"

  - id: F-aic-entry-wait4
    domain: impl
    kind: fact
    provenance: doc
    title: "AIC 入口即 Wait(ST_AIV_DONE=4)"
    statement: "fused AIC 第一句是 FsmWait(4) 再 FsmSet(8)；若双 AIV 未在 prep+SoftSync 后都 SET(4)，AIC 在入口死等"
    deps: []
    status: verified
    basis: spec
    evidence: "f203_decrypt_device_fused_entry.cpp AIC 分支开头 Wait(4)/Set(8)"

  - id: F-aiv-set4-after-softsync
    domain: impl
    kind: fact
    provenance: doc
    title: "双 AIV 在 SoftSync 之后才 SET(4)"
    statement: "AIV 路径：prep(仅0) → SoftSyncArrive(slot) → FsmSet(4) → FsmWait(8) → SoftSyncClear；AIV1 未等到哨兵就不会 SET(4)"
    deps: [F-softsync-two-slots, F-aic-entry-wait4]
    status: verified
    basis: spec
    evidence: "fused AIV 分支 slot0 与 slot1 两段"

  - id: F-two-gate-two-cube
    domain: impl
    kind: fact
    provenance: doc
    title: "同核两轮 GATE + 两轮 Cube（NTT 然后 INTT）"
    statement: "一轮：Wait(4)/Set(8) → NTT flag1 MMAD flag3；二轮：再 Wait(4)/Set(8) → INTT flag1 MMAD flag3；中间夹 su_dot+pad+SoftSync slot1"
    deps: [F-aic-entry-wait4]
    status: verified
    basis: spec
    evidence: "fused AIC/AIV 全文顺序"

  - id: F-ntt-flags-123-intt-13
    domain: impl
    kind: fact
    provenance: doc
    title: "NTT 用 flag 1/2/3；INTT 用 1/3 不用 2"
    statement: "NTT AIC 在 Wait(1) 后置 st=ST_MMAD=2 再 MMAD 再 Set(3)；INTT 等 Stage1 后直接 MMAD 再 Set(3)，注释写禁 flag 2 以对齐 Encrypt"
    deps: [F-two-gate-two-cube]
    status: verified
    basis: spec
    evidence: "fused 文件头与 AIC INTT 段"

  - id: F-syncall-after-aic
    domain: impl
    kind: fact
    provenance: doc
    title: "SyncAll 仅在 AIC 已返回后可用"
    statement: "MIX 下 SyncAll<isAIVOnly=true> 仅当 AIC 已返回后用于双 AIV 汇合；AIC 仍 Wait 时调用不合法"
    deps: []
    status: verified
    basis: spec
    evidence: "CANN-AscendC 查阅索引 2026-07-13；Encrypt hang 图 F-syncall-after-aic"

  - id: F-encrypt-omit-set4-hangs-sim
    domain: verify
    kind: fact
    provenance: measurement
    title: "Encrypt toy：入口 Wait(4) 且省略 SET(4) 时 SIM 超时 124"
    statement: "fix-encrypt-skel-mix-chain-toy 在 SKIPNTT=1 且 OMIT_SET4=1 时 kernel 计算段超时 rc=124；合法 SET(4) 则绿。本机制与 Decrypt AIC 入口 Wait(4) 同构，须在 Decrypt toy 上独立复现"
    repro: "cd ascendc-tests/fix-encrypt-skel-mix-chain-toy && KERNEL_COMPUTE_BUDGET_SEC=60 SKEL_SKIPNTT=1 SKEL_OMIT_SET4=1 SIM_DIRECT=1 bash run.sh -r sim -v Ascend910B4"
    deps: []
    status: verified
    basis: experiment
    evidence: "docs/rg-kem-encrypt-hang.yaml F-omit-set4-hangs-sim；FB-TASK-004"

  - id: F-encrypt-falsified-dual-cube-only
    domain: verify
    kind: fact
    provenance: observation
    title: "Encaps 已证伪「同核双 Cube 是卡死充分条件」"
    statement: "Encaps 默认 2-launch 每 MIX 一轮 Cube、SPLIT 的 ntt_y 单 Cube 仍可粘；不得把 Decrypt fused 两轮 Cube 当成 hang 的充分解释去请用户上机"
    deps: []
    status: verified
    basis: experiment
    evidence: "docs/rg-kem-encrypt-hang.yaml J-only-dual-cube retracted；qa/2026-09-03"

  # ================= 假说（待 toy） =================
  - id: J-omit-set4-hangs-decrypt
    domain: impl
    kind: inference
    derivation: defeasible
    title: "Decrypt fused：prep 后缺 SET(4) 足以让 AIC 入口死等"
    statement: "在 stub 化 Decrypt 握手 toy 上，合法 SoftSync 后若省略双 AIV SET(4)，SIM 超时挂死；补 SET(4) 则绿。与 Encaps skipNtt 缺 SET(4) 同构，已在 Decrypt 拓扑独立复现"
    deps: [F-aic-entry-wait4, F-aiv-set4-after-softsync, F-encrypt-omit-set4-hangs-sim, F-decrypt-omit-set4-hangs-sim, F-decrypt-skel-legal-sim-pass]
    status: verified
    basis: experiment
    evidence: "FB-TASK-009：A wall 3.934s 绿；B budget 60s rc=124"

  - id: J-omit-slot0-spin-hangs
    domain: impl
    kind: inference
    derivation: defeasible
    title: "AIV0 不 Arrive(slot0) 时 AIV1 自旋且 AIC 入口死等"
    statement: "SoftSync 是 SET(4) 的前置：AIV0 不写哨兵 ⇒ AIV1 不 SET(4) ⇒ AIC Wait(4) 挂；这是 Decrypt 相对 Encaps toy 的新一层"
    deps: [F-softsync-two-slots, F-aiv-set4-after-softsync, F-aic-entry-wait4]
    status: retracted
    basis: experiment
    evidence: "TASK-010：宏已进 device，AIV0 省略写哨兵，SIM 仍 rc=0 wall 3.632s；空 while 未转化为可观测挂"
    retracted_by: F-omit-slot0-no-hang-sim

  - id: J-omit-slot1-hangs-after-ntt
    domain: impl
    kind: inference
    derivation: defeasible
    title: "第一轮 Cube 后第二轮缺 SET(4) 足以卡在第二段 GATE"
    statement: "第一轮 GATE+Cube 合法完成后，第二轮双 AIV 省略 SET(4) 时 AIC 在第二段 Wait(4) 死等，Host 看不到 kernel 返回。已在 Decrypt toy 用 SKEL_OMIT_SET4_R2 复现"
    deps: [F-two-gate-two-cube, F-decrypt-omit-set4-hangs-sim, F-decrypt-omit-set4-r2-hangs-sim]
    status: verified
    basis: experiment
    evidence: "FB-TASK-011：R2=1 wall 60.103s rc=124；默认仍绿"

  - id: J-dirty-softsync-hang-vs-race
    domain: impl
    kind: inference
    derivation: defeasible
    title: "未清零的 softSync 更常导致误放行而非自旋挂"
    statement: "Host 预填 softSync=1 时 AIV1 跳过自旋（误放行路径），SIM 上仍正常结束；预填 0 同清零亦绿。脏非零哨兵不是 SIM hang 充分条件"
    deps: [F-host-zeros-softsync, F-softsync-two-slots, F-dirty-softsync-prefill1-sim-pass]
    status: verified
    basis: experiment
    evidence: "FB-TASK-012：PREFILL=0/1 均 rc=0 wall≈3.9/4.1s"

  - id: J-prep-scalar-not-sufficient-hang
    domain: impl
    kind: inference
    derivation: defeasible
    title: "AIV0 prep 标量偏长本身不足以挂（只要最终 Arrive）"
    statement: "AIV1 在 slot0 自旋等待 AIV0 unpack/decode；只要 AIV0 最终写哨兵，这是设计内忙等，不是死锁。只有 AIV0 永不 Arrive 或随后不 SET(4) 才挂"
    deps: [F-softsync-two-slots, F-aiv-set4-after-softsync]
    status: unverified
    basis: experiment
    evidence: "待 stub prep 拉长仍绿的对照"

  - id: J-intt-flag2-residue
    domain: impl
    kind: inference
    derivation: defeasible
    title: "INTT 不用 flag 2 可能与 NTT 残留 flag 交互（弱）"
    statement: "NTT AIC 使用 ST_MMAD=2 仅作本地标记、INTT 跳过 flag 2；若硬件 CrossCore flag 2 有残留，理论上可干扰下一 launch。优先级别低于 Wait(4)/SoftSync；勿在未沉前两层前当主因"
    deps: [F-ntt-flags-123-intt-13]
    status: unverified
    basis: experiment
    evidence: "仅源码注释；无 SIM 证据"

  - id: J-dual-cube-sufficient-hang
    domain: impl
    kind: inference
    derivation: defeasible
    title: "（已证伪，勿再当主因）同核两轮 Cube 是 Decrypt 卡死充分条件"
    statement: "若充分条件仅为同核双 Cube，则 Encaps 单 Cube launch 不应粘；Decrypt fused 虽确有两轮 Cube，但不能单独解释 hang"
    deps: [F-two-gate-two-cube, F-encrypt-falsified-dual-cube-only]
    status: retracted
    basis: experiment
    evidence: "借入 Encaps J-only-dual-cube 证伪；本线不把 dual Cube 当第一刀"
