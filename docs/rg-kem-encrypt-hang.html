    // 子类型 pill(点开在详情说明):fact 的来源 provenance / inference 的 derivation / decision 的主体 by。
    var _sub = n.provenance || n.derivation || n.by;
    var _subTitle = n.provenance ? "fact 来源" : n.derivation ? "inference 推理类型" : "decision 主体";
    // 已知子类型(示例方言)显示 glyph+中文标签;未知值(别的项目自定义)回退显示原字符串。
    var _subPill = _sub
      ? '<span class="pill" title="' + _subTitle + '" style="background:' +
        cssVar("--surface-3") + ';color:' + cssVar("--ink") + '">' +
        (SUBTYPE_GLYPH[_sub] ? SUBTYPE_GLYPH[_sub] + ' ' : '') + (SUBTYPE_LABEL[_sub] || _sub) + '</span>'
      : '';
    idBox.innerHTML =
      '<div class="detail-id">' + nodeLabel(n) + '</div>' +
      (n.title ? '<div class="detail-title"></div>' : '') +
      '<div class="pill-row">' +
      '<span class="pill" style="background:' + domainMeta[n.domain].solid + ';color:#fff">' + n.domain + '</span>' +
      '<span class="pill" style="background:' + cssVar("--surface-2") + ';color:' + cssVar("--ink-dim") + '">' + kindMeta(n.kind).label + '</span>' +
      _subPill +
      '<span class="pill" style="background:' + statusColor(n.status) + ';color:' + statusInk(n.status) + '">' + statusMeta(n.status).label + '</span>' +
      // 依据也要露出来:光看 status 分不清"我们跑过"还是"抄了篇没核过的论文"
      (n.basis ? '<span class="pill" style="background:transparent;border:1px solid var(--ink-dim);color:var(--ink-dim)" title="' +
                 (BASIS_HINT[n.basis] || '') + '">依据:' + (BASIS_LABEL[n.basis] || n.basis) +
                 (basisTrust[n.basis] === false ? ' ✕已撤销' : '') + '</span>' : '') +
      (n._decl && n._decl !== n.status ? '<span class="pill" style="background:transparent;border:1px dashed var(--ink-dim);color:var(--ink-dim)">原声明:' + n._decl + '</span>' : '') +
      '</div>';
    // 详情面板是唯一渲染 LaTeX 的地方(title/statement/evidence 三个文本字段)。
    if (n.title) TEX.render(idBox.querySelector(".detail-title"), n.title);
    head.appendChild(idBox);
    if (preview) {
      // 悬停预览态:不给×(移开即恢复,无需手动关);标一枚角标提示"这是临时预览、点击可固定"。
      var tag = document.createElement("span");
      tag.className = "detail-preview-tag"; tag.textContent = "悬停预览";
      tag.title = "临时预览;移开鼠标即恢复,点击节点可固定";
      head.appendChild(tag);
    } else {
      // 右上角「×」= 关掉详情面板,**不取消选中**(节点仍选中、相关仍高亮)。要真正取消选中:点画布空白 / 按 Esc。
      var close = document.createElement("button");
      close.className = "detail-close"; close.innerHTML = "&times;"; close.title = "关闭详情（不取消选中）";
      close.setAttribute("aria-label", "关闭详情面板");
      close.addEventListener("click", function (ev) { ev.stopPropagation(); state.panelHidden = true; updateDetail(); });
      head.appendChild(close);
    }
    detailPanel.appendChild(head);

    // ---- 人工强制(只对主张类节点:fact / inference)----
    // 强制是**你对这张图撒的一个谎** —— 所以它必须一眼可见(节点上多一圈同色实线环)、
    // 随时可撤(这里三选一,左栏还有"清除全部")。强制 verified 会阻断上游的不确定性,
    // 这正是它的用途:把某条外部结论当公理接受下来,看剩下的链条还剩什么。
    if (CLAIM_KINDS[n.kind] && !preview) {
      var fSec = document.createElement("div");
      fSec.className = "detail-section force-section";
      var cur = forcedStatus[n.id] || "auto";

      fSec.innerHTML =
        '<p class="field-label">人工判定</p>' +
        '<div class="force-row">' +
        ['auto', 'verified', 'unverified'].map(function (v) {
          var lbl = v === "auto" ? "跟随推导" : (v === "verified" ? "强制成立" : "强制未证");
          return '<button class="force-btn' + (cur === v ? " on" : "") +
                 '" data-v="' + v + '">' + lbl + '</button>';
        }).join("") +
        '</div>' +
        '<p class="field-note">' +
        (cur === "auto"
          ? "当前按依据与依赖自动推出。"
          : "已人工钉死为 <b>" + (cur === "verified" ? "成立" : "未证") +
            "</b>,节点上带同色实线外环;" +
            (cur === "verified" ? "上游的不确定性到此为止,不再向下游传播。" : "并向下游传播。")) +
        "<br>人工判定<b>只影响你这个浏览器的视图,不写回 yaml</b> —— 它是当场设的假设,不是结论。" +
        '</p>';

      // ---- 未证/悬空的**来源**:自身声明,还是继承自上游? ----
      // 这两种在画布上长得一模一样(同色、都没有环),但含义与处置完全相反:
      //   · 自身声明未证 = 没有人证过它。把上游全部强制成立**也不会**让它变,
      //     因为缺的是它自己那一步的证明;
      //   · 继承自上游   = 它自己站得住,是脚下软。认下那些上游它就会跟着恢复。
      // 不写出来的话,读图的人只会觉得"我强制了上游,它怎么不动"。
      if (!forcedStatus[n.id] && (statusMeta(n.status).uncertain || isConditional(n))) {
        var selfBad = statusMeta(n._decl).uncertain;
        var softDeps = (n.deps || []).filter(function (p) {
          var d = byId[p];
          return d && (statusMeta(d.status).uncertain || isConditional(d));
        });
        var q = document.createElement("p");
        q.className = "field-note";
        q.innerHTML = selfBad
          ? "未证的来源:<b>本条自身</b> —— 声明即未证,没有人证过它。" +
            "把上游全部强制成立<b>也不会</b>让它变成成立(缺的是它自己那一步的证明)。" +
            (softDeps.length ? "(上游另有 " + softDeps.length + " 条也未证:" +
                               softDeps.join("、") + ")" : "")
          : "未证的来源:<b>上游</b> —— " + (softDeps.join("、") || "(上游已恢复,等待重算)") +
            "。它自己站得住,是脚下软:把这些上游认下来,本条就会跟着恢复。";
        fSec.appendChild(q);
      }
      // 改完之后要**看得见它做了什么**。条件成立的下游在本设计里只是外环消失、
      // 本体不变色,而选中态又会把无关节点压暗 —— 光看画布很容易以为"没反应"。
      // 所以把这一次的三态位移直接报出来。
      if (lastForce && lastForce.id === n.id) {
        var p = document.createElement("p");
        p.className = "field-note";
        p.style.color = lastForce.list.length ? condColor() : "";
        p.innerHTML = lastForce.list.length
          ? "本次连带改变下游 <b>" + lastForce.list.length + "</b> 条:" +
            lastForce.list.slice(0, 6).join("、") +
            (lastForce.list.length > 6 ? " 等" : "")
          // 别猜原因。最常见的其实是「下游自身声明就是未证」—— 强制上游改不了它。
          : "本次没有连带改变任何下游。若某个下游仍是未证,点开它看「未证的来源」" +
            "那一行:多半写着<b>本条自身</b>,那就不是上游能救的。";
        fSec.appendChild(p);
      }
      fSec.querySelectorAll(".force-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          var v = b.getAttribute("data-v");
          // 逐节点快照,**排除被强制的这一条自己** —— 只数真正的连带
          var was = {};
          GRAPH_DATA.forEach(function (m) { was[m.id] = m.status + "|" + (isConditional(m) ? 1 : 0); });
          if (v === "auto") delete forcedStatus[n.id]; else forcedStatus[n.id] = v;
          saveForced();
          effectiveStatusPass();
          var moved = [];
          GRAPH_DATA.forEach(function (m) {
            if (m.id === n.id || !CLAIM_KINDS[m.kind]) return;
            if (was[m.id] !== m.status + "|" + (isConditional(m) ? 1 : 0)) moved.push(m.id);
          });
          lastForce = { id: n.id, list: moved };
          refreshStatusVisuals();
          applyHighlight();     // 同上:人工强制不改变可见集,别用 relayout 把视角拉回去
        });
      });
      detailPanel.appendChild(fSec);
    }

    var stSec = document.createElement("div");
    stSec.className = "detail-section";
    stSec.innerHTML = '<p class="field-label">陈述</p><p class="detail-statement"></p>';
    TEX.render(stSec.querySelector(".detail-statement"), n.statement);
    detailPanel.appendChild(stSec);

    var evSec = document.createElement("div");
    evSec.className = "detail-section";
    var evBox = document.createElement("div");
    evBox.className = "detail-evidence" + (n.evidence ? "" : " empty");
    if (n.evidence) TEX.render(evBox, n.evidence);
    else evBox.textContent = "无显式来源（推理得出，见依赖链）";
    evSec.innerHTML = '<p class="field-label">证据 / 来源</p>';
    evSec.appendChild(evBox);
    detailPanel.appendChild(evSec);

    // ---- 机器验证（可选字段 verification）----
    // 老图没有这个字段 → 整块不渲染，行为与从前逐字一致。
    var _ver = normalizeVerification(n.verification);
    if (_ver.length) {
      var vSec = document.createElement("div");
      vSec.className = "detail-section";
      vSec.innerHTML = '<p class="field-label">机器验证（形式化证明）</p>';
      // 一句话概括这个节点的证明由谁写 —— 读者最先想知道的就是这个。
      var _up = _ver.filter(function (v) { return v.origin === "upstream"; }).length;
      var _own = _ver.filter(function (v) { return v.origin === "own"; }).length;
      if (_up || _own) {
        var sum = document.createElement("div");
        sum.className = "detail-verif-summary";
        // 概览这行是最先被看到的标签,和下面每条的角标同一个语义 ——
        // 只让下面能点、上面不能点,读起来像是坏的。
        [["upstream", _up, "上游自带"], ["own", _own, "本项目补证"]].forEach(function (t) {
          if (!t[1]) return;
          if (sum.childNodes.length) sum.appendChild(document.createTextNode(" · "));
          var sp = document.createElement("span");
          sp.className = "verif-sum-part";
          sp.textContent = t[2] + " " + t[1] + " 条";
          sum.appendChild(makeTagChip(sp, "origin", t[0], t[2]));
        });
        vSec.appendChild(sum);
      }
      // 服务端 collect() 是在**原始**数组上编号的,而 _ver 过滤掉了非对象条目。
      // 必须拿原始下标去请求,两边才对得上 —— 用 _ver 的下标会在图里
      // 混了脏条目时整体错位,点开的是**另一条**证明的源码。
      var _rawVer = Array.isArray(n.verification) ? n.verification
                  : (n.verification ? [n.verification] : []);
      _ver.forEach(function (v, i) {
        var box = document.createElement("div");
        box.className = "verif-item";
        var mp = document.createElement("span");
        mp.className = "verif-method";
        mp.textContent = (VERIF_GLYPH[v.method] || "🔧") + " " + (v.method || "?");
        // 验证方式和来源是同一排、同一种角标。只让来源能点会显得是漏做的,
        // 而"图里还有哪些是 lean 证的"本来就是个会被问到的问题。
        if (v.method) makeTagChip(mp, "method", v.method, v.method);
        box.appendChild(mp);
        if (v.origin === "upstream" || v.origin === "own") {
          var op = document.createElement("span");
          op.className = "verif-origin " + v.origin;
          op.textContent = v.origin === "upstream" ? "上游自带" : "本项目补证";
          op.title = v.origin === "upstream"
            ? "这条证明随被形式化的材料一起来的（不是本项目写的）"
            : "这条证明是本项目补的（原材料里没有）";
          makeTagChip(op, "origin", v.origin, op.textContent);
          box.appendChild(op);
        }
        if (v.origin_note) {
          var on = document.createElement("span");
          on.className = "verif-skip";
          on.textContent = v.origin_note;
          box.appendChild(on);
        }
        var loc = document.createElement("code");
        loc.className = "verif-loc";
        loc.textContent = (v.decl ? v.decl + "\n" : "") + (v.path || "");
        box.appendChild(loc);

        // 「查看源码」是**逐条**的,和整节点那个「现场验证」层级不同:
        // 验证按节点批量跑(同一批共用一个工具链进程),源码则一条一个文件位置。
        if (v.path) {
          var srcIdx = _rawVer.indexOf(v);
          var srcOk = RUNNER.up && srcIdx >= 0;
          var sbtn = document.createElement("button");
          sbtn.className = "verif-src" + (srcOk ? "" : " disabled");
          sbtn.textContent = "▤ 查看源码";
          sbtn.title = srcOk
            ? "打开一个只读窗口显示这条证明的源文件(改不了它)"
            : "没有探测到本地 rg_verify 服务,取不到源文件";
          sbtn.addEventListener("click", function (ev) {
            ev.stopPropagation();
            if (srcOk) VSRC.open(n.id, srcIdx, v);
          });
          box.appendChild(sbtn);
        }
        if (v.expect_axioms && v.expect_axioms.length) {
          var ea = document.createElement("span");
          ea.className = "verif-hint";
          ea.textContent = "允许的公理：" + v.expect_axioms.join(", ");
          box.appendChild(ea);
        }
        if (v.skip_run) {
          var sk = document.createElement("span");
          sk.className = "verif-skip";
          sk.textContent = "⊘ 本机不跑：" + v.skip_run;
          box.appendChild(sk);
        }
        vSec.appendChild(box);
      });

      // 按钮属于**整个节点**，不属于某一条证明：runner 是按节点批量跑的
      // （同一批共用一个工具链进程，一次把这个节点的所有声明都验掉）。
      // 早先把它挂在第一条上，多条证明时看着像"只有第一条能验"，是误导。
      //
      // 按钮**始终渲染**：功能不可用时干脆不显示，等于让用户既看不见它、
      // 也无从知道该怎么开启。
      var runnable = RUNNER.up && RUNNER.verifiable.indexOf(n.id) !== -1;
      var btn = document.createElement("button");
      btn.className = "verif-run" + (runnable ? "" : " disabled");
      var howMany = _ver.length > 1 ? ("（一次跑完这 " + _ver.length + " 条）") : "（点击真跑一遍）";
      btn.textContent = runnable ? ("▶ 现场验证" + howMany) : "⊘ 现场验证 · 未连接本地服务";
      btn.title = runnable
        ? "调用本地 rg_verify 服务，把本节点登记的 " + _ver.length +
          " 条证明一次跑完；输出显示在页面底部的终端面板"
        : "没有探测到本地 rg_verify 服务；点击查看如何开启";
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (runnable) { VC.run(n.id, _ver.length > 1 ? (_ver.length + " 条") : (_ver[0].decl || _ver[0].path || "")); }
        else { VC.showHowTo(n.id); }
      });
      vSec.appendChild(btn);
      if (!RUNNER.up) {
        var hint = document.createElement("div");
        hint.className = "verif-hint";
        hint.textContent = "想在这里一键重跑？在仓库根执行：python rg_verify.py --yaml <图谱> --serve";
        vSec.appendChild(hint);
      }
      detailPanel.appendChild(vSec);
    }

    detailPanel.appendChild(chipRow(n.deps, "依赖谁（上游 · " + n.deps.length + "）"));
    detailPanel.appendChild(chipRow(dependents[n.id] || [], "谁依赖它（下游 · " + (dependents[n.id] || []).length + "）"));
    // references:「我引用它」而非「我以它为前提」——不是依赖,**不传播不确定性**。
    // 典型是"陈述论证状态"的节点(「用这条界需要某条未证假设」):它不假设对方为真,
    // 恰恰断言对方没被证明。写进 deps 会让「X 未被证明」这句话本身永远无法标为已证。
    if (n.references && n.references.length)
      detailPanel.appendChild(chipRow(n.references,
        "引用（references · " + n.references.length + "，不是前提、不传播不确定性）"));
    if ((referencedBy[n.id] || []).length)
      detailPanel.appendChild(chipRow(referencedBy[n.id],
        "被谁引用（referenced-by · " + referencedBy[n.id].length + "）"));
    if (n.targets && n.targets.length) detailPanel.appendChild(chipRow(n.targets, "瞄准的问题（targets · " + n.targets.length + "）"));
    if ((targetedBy[n.id] || []).length) detailPanel.appendChild(chipRow(targetedBy[n.id], "被谁瞄准（targeted-by · " + targetedBy[n.id].length + "）"));
  }

  // ---- filtering + highlight ----
  // 搜索匹配（结构可见之外的软过滤，仅 dim，不重排）
  function matchesSearch(n) {
    if (!state.query) return true;
    // 索引里**同时**放 LaTeX 原文和去 TeX 化后的近似:写了 `$\tau$` 的节点,
    // 搜 "tau"(照着源码敲)和搜 "τ"(照着面板上看到的敲)都要能命中。
    var raw = (n.id + " " + (n.title || "") + " " + n.domain + " " + n.statement + " " + (n.evidence || ""));
    var hay = (raw + " " + TEX.plain(raw)).toLowerCase();
    return hay.indexOf(state.query) !== -1;
  }
  // matchesFilter = 结构可见 && 搜索命中：applyHighlight 用它决定"淡不淡"。
  // 结构不可见的节点已被 updateVisibility 设成 display:none（不占位、不参与布局），
  // 这里对它们打 dim class 只是无害兜底。
  function matchesFilter(n) {
    return structVisible(n) && matchesSearch(n);
  }
  // 依可见集切换节点/边/blob 的 display（隐藏=彻底不渲染、不占位）
  function updateVisibility() {
    // visibleSet 已是"结构过滤 ∩ isolate"的最终可见集(computeLayout 里算好),这里直接据它 display 开合。
    GRAPH_DATA.forEach(function (n) {
      var vis = !!state.visibleSet[n.id];
      nodeEls[n.id].style.display = vis ? "" : "none";
      if (blobEls[n.id]) blobEls[n.id].style.display = vis ? "" : "none";
    });
    Object.keys(edgeEls).forEach(function (k) {
      var e = edgeEls[k];
      var vis = state.visibleSet[e.fromId] && state.visibleSet[e.toId];
      e.path.style.display = vis ? "" : "none";
    });
  }

  // ---- 标签高亮 ----
  function nodeHasTag(n, tag) {
    if (!n || !tag) return false;
    if (tag.kind === "domain") return n.domain === tag.value;
    if (tag.kind === "nodekind") return n.kind === tag.value;
    // status 按**声明值** `_decl` —— 和左栏这一行的计数、以及 structVisible 同口径。
    // 用被 effectiveStatusPass() 覆写过的有效状态会出现"点亮数和行尾那个数字对不上",
    // 而这两个数字就并排放在同一行里,对不上就是明摆着的错。
    if (tag.kind === "status") return n._decl === tag.value;
    // basis 那一栏的计数只数**主张类**节点(CLAIM_KINDS),这里必须同口径,
    // 否则点亮数会比它旁边那个数字大。
    if (tag.kind === "basis") return !!CLAIM_KINDS[n.kind] && n.basis === tag.value;
    var vs = normalizeVerification(n.verification);
    for (var i = 0; i < vs.length; i++) {
      if (tag.kind === "origin" && vs[i].origin === tag.value) return true;
      if (tag.kind === "method" && (vs[i].method || "") === tag.value) return true;
    }
    return false;
  }
  // 提示条就地改写成"点亮了几个" —— 不另建浮层:这是个临时态,多一个会自己冒出来的
  // 元素反而要解释;而且**数量**才是这个功能真正的产出(「本项目补证」到底覆盖了多少)。
  function syncTagHint() {
    var h = document.querySelector(".hint");
    if (!h) return;
    if (!h.getAttribute("data-base")) h.setAttribute("data-base", h.textContent);
    if (!state.tagLit) { h.textContent = h.getAttribute("data-base"); return; }
    var k = 0, hid = 0;
    GRAPH_DATA.forEach(function (n) {
      if (!nodeHasTag(n, state.tagLit)) return;
      if (state.visibleSet[n.id]) k++; else hid++;
    });
    // 死节点那几档 status 默认不勾选 —— 点它们的「点亮」会一个都亮不起来。
    // 不偷偷替用户把过滤勾上(那会触发重排、改掉他的视图),而是把话说明白。
    h.textContent = "标签高亮：「" + state.tagLit.label + "」共 " + k + " 个节点已点亮"
      + (hid ? "（另有 " + hid + " 个被左栏过滤隐藏,勾上对应那行才看得到）" : "")
      + " · 点别处 / Esc / 再点一次该标签即恢复";
  }
  // 面板里同一个标签可能出现多次(概览一处、每条证明各一处),选中态要一起走。
  function syncTagChips() {
    var chips = document.querySelectorAll("[data-tag-kind]");
    for (var i = 0; i < chips.length; i++) {
      var c = chips[i], t = state.tagLit;
      c.classList.toggle("tag-on", !!t
        && c.getAttribute("data-tag-kind") === t.kind
        && c.getAttribute("data-tag-value") === t.value);
    }
  }
  function toggleTagLit(tag) {
    var cur = state.tagLit;
    var same = cur && cur.kind === tag.kind && cur.value === tag.value;
    state.tagLit = same ? null : tag;
    syncTagHint(); syncTagChips(); applyHighlight();
  }
  function clearTagLit() {
    if (!state.tagLit) return false;
    state.tagLit = null;
    syncTagHint(); syncTagChips(); applyHighlight();
    return true;
  }
  // 把一个**已经建好**的标签变成可点的高亮开关。不新建元素 —— 标签长什么样归各自
  // 那段代码管,这里只加行为,免得同一个角标在两处各画一遍、以后改样式漏一处。
  function makeTagChip(el, kind, value, label) {
    if (!value) return el;
    el.classList.add("tag-click");
    el.setAttribute("data-tag-kind", kind);
    el.setAttribute("data-tag-value", value);
    // <button> 自带按钮语义与键盘激活;只有 <span> 做的角标才需要补。
    var native = el.tagName === "BUTTON";
    if (!native) { el.setAttribute("role", "button"); el.setAttribute("tabindex", "0"); }
    el.title = (el.title ? el.title + String.fromCharCode(10) : "")
      + "点一下：图上所有「" + label + "」的节点点亮，其余压暗（点别处恢复）";
    el.addEventListener("click", function (ev) {
      // 必须拦住冒泡:文档级那个"点别处就恢复"的监听会把它当成"别处"。
      ev.stopPropagation();
      toggleTagLit({ kind: kind, value: value, label: label });
    });
    // 真按钮上不要再挂:Enter/空格 的原生激活已经会发 click,自己再补一次
    // 要么双触发(等于没反应)、要么得靠 preventDefault 去压原生行为 —— 都不如不挂。
    if (!native) el.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ev.stopPropagation(); el.click(); }
    });
    if (state.tagLit && state.tagLit.kind === kind && state.tagLit.value === value) el.classList.add("tag-on");
    return el;
  }

  // 边配色按「方向 × 深度」:往上偏红、往下偏蓝;直接(1跳)最深,越间接越浅(与线宽渐变叠加,更易分层)。
  var HL_UP = ["#e0322f", "#ef7a6d", "#f4b0a6"];   // 红:直接 / 间接 / 再间接
  var HL_DOWN = ["#2f6fe0", "#5f9bf2", "#a7c8f7"]; // 蓝:直接 / 间接 / 再间接

  function applyHighlight() {
    var tag = state.tagLit;
    // 标签高亮期间**接管**依赖链高亮:详情面板只有在选中节点时才在,所以点标签的那一刻
    // focus 一定是有值的,不置空的话"另一批带同标签的节点"会先被链高亮压成 dim(0.14),
    // 点亮就成了空话。这一刻只回答一个问题:谁带这个标签。
    var focus = tag ? null : (state.hovered || state.selected);
    // when a node is selected, chain reveal is progressive via state.litUp/litDown;
    // on hover (no selection) reveal whole chain immediately.
    var up, down;
    if (state.selected && focus === state.selected) {
      up = state.litUp; down = state.litDown;
    } else if (focus) {
      up = upLevels(focus); down = downLevels(focus);
    } else { up = null; down = null; }

    GRAPH_DATA.forEach(function (n) {
      var g = nodeEls[n.id];
      var visible = matchesFilter(n);
      var inChain = focus && (n.id === focus || (up && up[n.id] !== undefined) || (down && down[n.id] !== undefined));
      g.classList.toggle("dim", !visible || (!!focus && !inChain));
      g.classList.toggle("selected", n.id === state.selected);
      g.classList.toggle("up", !!focus && up && up[n.id] !== undefined);
      g.classList.toggle("down", !!focus && down && down[n.id] !== undefined);
      var tagHit = !!tag && nodeHasTag(n, tag);
      g.classList.toggle("tag-lit", visible && tagHit);
      g.classList.toggle("tag-dim", !!tag && visible && !tagHit);
      var row = nodeListRows[n.id];
      if (row) {
        row.classList.toggle("faded", !visible || (!!tag && !tagHit));
        row.classList.toggle("active", n.id === state.selected);
      }
      var blob = blobEls[n.id];
      if (blob) blob.style.opacity = (visible && !(tag && !tagHit)) ? "1" : "0.12";
    });

    Object.keys(edgeEls).forEach(function (e) {
      var edge = edgeEls[e]; var p = edge.path;
      var visible = matchesFilter(byId[edge.fromId]) && matchesFilter(byId[edge.toId]);
      // 两端都带标签的边才留亮 —— 否则一堆亮线连到压暗的节点上,反而看不清点亮了哪些。
      p.classList.toggle("tag-dim", !!tag
        && !(nodeHasTag(byId[edge.fromId], tag) && nodeHasTag(byId[edge.toId], tag)));
      // targets 是"瞄准"边、不属依赖链:只随可见性明暗,保持静态紫虚线,不参与 up/down 上色与 marker 切换
      if (edge.isTarget) {
        var litT = focus && (edge.fromId === focus || edge.toId === focus);
        p.classList.toggle("dim", !visible || (!!focus && !litT));
        return;
      }
      var fromLit = focus && (edge.fromId === focus || (up && up[edge.fromId] !== undefined));
      var toLitUp = focus && (edge.toId === focus || (up && up[edge.toId] !== undefined));
      var onUp = fromLit && toLitUp;
      var fromLitDown = focus && (edge.fromId === focus || (down && down[edge.fromId] !== undefined));
      var toLitDown = focus && (edge.toId === focus || (down && down[edge.toId] !== undefined));
      var onDown = fromLitDown && toLitDown;
      var isUp = !!onUp && !onDown, isDown = !!onDown && !onUp;
      p.classList.toggle("dim", !visible || (!!focus && !onUp && !onDown));
      p.classList.toggle("up", isUp);
      p.classList.toggle("down", isDown);
      p.setAttribute("marker-end", onUp ? "url(#arrow-up)" : onDown ? "url(#arrow-down)" : "url(#arrow-base)");
      // 依赖链景深:**直接依赖(1 跳)粗且满**、往下每层**陡降**——一眼分"亲自依赖的"vs"再往下传递的"。
      // 用 non-scaling-stroke 让直接边任何缩放下都恒定醒目(否则密图/拉远时全变细看不出)。
      // depth = 深端节点到点击节点的跳数。
      if (isUp || isDown) {
        var depth = isDown ? (down[edge.toId] || 1) : (up[edge.fromId] || 1);
        // 颜色按方向:被依赖(上游)=红、往下依赖(下游)=蓝;直接跳最深色,越间接越浅(箭头 context-stroke 自动同色)。
        p.style.stroke = (isDown ? HL_DOWN : HL_UP)[Math.min(depth, HL_UP.length) - 1];
        // 透明度/线宽随深度递减,但都有兜底 → 深层依赖也看得见,不会淡到消失。
        p.style.opacity = Math.max(0.5, 1.0 - (depth - 1) * 0.22).toFixed(2);
        p.style.strokeWidth = Math.max(1.6, 4.0 - (depth - 1) * 1.0).toFixed(2) + "px";
        p.style.vectorEffect = "non-scaling-stroke";
      } else {
        p.style.stroke = ""; p.style.opacity = ""; p.style.strokeWidth = ""; p.style.vectorEffect = "";
      }
    });
  }

  // progressive chain-lighting on select
  // revealTimers 是模块级共享变量（跨 boot 轮次），这里不再用 var 重新声明局部遮蔽——
  // 赋值直接落到外层变量上，好让下一轮 boot() 开头的 clearReveal() 能清掉本轮挂起的定时器。
  function clearReveal() { revealTimers.forEach(clearTimeout); revealTimers = []; }
  function selectNode(id) {
    clearReveal();
    // 换选中 = 换话题,标签高亮跟着散。放在最前:下面 updateDetail() 重建面板时
    // 要据 state.tagLit 决定角标的选中态,晚清会重建出一批"亮着但已失效"的标签。
    state.tagLit = null; syncTagHint();
    // 悬停预览的优先级高于选中(见 updateDetail),所以选中时必须把悬停清掉 ——
    // 否则在"顶住不消失"的预览面板里点依赖 chip 换节点,面板会纹丝不动(还显示原来那条)。
    cancelHoverClear();
    state.hovered = null;
    state.selected = id;
    state.panelHidden = false;   // 新选中 → 详情默认打开(即便刚才用 × 关过也复位)
    state.litUp = {}; state.litDown = {};
    // 选中与"锁定视角"**解耦**:锁定态下换选中只更新详情/高亮,**不重算可见子图、锚点不变**。
    updateDetail();       // 据 selected + panelHidden 显隐详情面板
    updateLockBtn();      // 标题栏锁定按钮:选中后才出现,文案随锁定态
    if (!id) { applyHighlight(); return; }

    var up = upLevels(id), down = downLevels(id);
    if (REDUCED) { state.litUp = up; state.litDown = down; applyHighlight(); return; }

    // reveal level by level, upstream & downstream in parallel
    var maxL = 0;
    Object.keys(up).forEach(function (k) { maxL = Math.max(maxL, up[k]); });
    Object.keys(down).forEach(function (k) { maxL = Math.max(maxL, down[k]); });
    applyHighlight();
    for (var lvl = 1; lvl <= maxL; lvl++) {
      (function (L) {
        revealTimers.push(setTimeout(function () {
          Object.keys(up).forEach(function (k) { if (up[k] === L) { state.litUp[k] = L; flashIn(k); } });
          Object.keys(down).forEach(function (k) { if (down[k] === L) { state.litDown[k] = L; flashIn(k); } });
          applyHighlight();
        }, L * 220));
      })(lvl);
    }
  }
  function flashIn(id) {
    var g = nodeEls[id];
    g.classList.add("lit-in");
    setTimeout(function () { g.classList.remove("lit-in"); }, 400);
  }

  // 锁定/解除视角(标题栏按钮):锁定以当前**选中**节点为锚 → 隔离到它的相关子图并补位重排;
  // 解除清空锚点/相关集 → 还原全图。锁定后再换选中不会走这里,故锚点(可见子图)保持不变。
  function toggleLock() {
    if (state.locked) {
      state.locked = false; state.lockAnchor = null; state.relatedSet = null;
    } else {
      if (!state.selected) return;               // 没选中不给锁
      state.lockAnchor = state.selected;
      state.relatedSet = computeRelatedSet(state.lockAnchor);
      state.locked = true;
    }
    relayout(450);      // computeLayout(据 passLock 隐藏无关)+ 补位重排 + fitToScreen + applyHighlight
    updateLockBtn();
  }

  // 详情面板显隐。优先级:PC 端悬停预览 > 选中(未被×关) > 隐藏。
  //   - hoverId(仅 PC 有效):鼠标悬停的节点 → 临时预览它的详情(带"悬停预览"标记、无×)。
  //   - 无悬停时回落:selected 且未被×关 → 显示选中节点;否则隐藏(= 移开后"恢复原状")。
  // 悬停不改 selected —— 所以移开即恢复:之前没选中→隐藏,之前选中→显示那个选中节点。
  function updateDetail() {
    var hoverId = (!isMobile() && state.hovered && byId[state.hovered]) ? state.hovered : null;
    var showId = hoverId || (state.panelHidden ? null : state.selected);
    if (!showId) { detailPanel.classList.remove("preview"); detailPanel.hidden = true; detailPanel.innerHTML = ""; return; }
    // 预览态 = 正显示的是"悬停节点"、且它不是当前已固定展示的选中节点。
    var preview = !!hoverId && !(hoverId === state.selected && !state.panelHidden);
    detailPanel.classList.toggle("preview", preview);
    renderDetail(showId, preview);
  }

  // 节点悬停(mouseenter=id / mouseleave=null):图上高亮其依赖链(所有端,原有行为)+
  // **仅 PC** 让详情面板临时预览它;updateDetail 内部按端判定,移动端悬停不动详情。
  //
  // 离开**不立刻**清空,而是延时 —— 因为预览面板可能正好盖住被悬停的节点本身:
  // 面板一冒出来鼠标就"离开"了节点 → 面板消失 → 鼠标又回到节点上 → 面板再出现,来回抖。
  // 延时窗口内若鼠标进了面板(见下面 detailPanel 的 mouseenter),就取消这次清空,
  // 于是「鼠标只要不移出悬停面板,面板就一直显示」。
  var hoverClearTimer = null;
  var HOVER_GRACE_MS = 160;
  function cancelHoverClear() {
    if (hoverClearTimer) { clearTimeout(hoverClearTimer); hoverClearTimer = null; }
  }
  function hoverNode(id) {
    cancelHoverClear();
    if (id === null) {
      if (state.hovered === null) return;
      hoverClearTimer = setTimeout(function () {
        hoverClearTimer = null;
        if (state.panelHover) return;      // 鼠标停在面板里 → 不撤
        state.hovered = null;
        applyHighlight();
        updateDetail();
      }, HOVER_GRACE_MS);
      return;
    }
    state.hovered = id;
    applyHighlight();
    updateDetail();
  }

  // 标题栏锁定按钮:选中任一节点后出现;已锁定→"解除视角",未锁定→"锁定视角";无选中且未锁定→隐藏。
  function updateLockBtn() {
    if (!lockBtn) return;
    lockBtn.hidden = !(state.selected || state.locked);
    lockBtn.classList.toggle("active", state.locked);
    lockBtn.textContent = state.locked ? "🔓 解除视角" : "🔒 锁定视角";
    lockBtn.title = state.locked
      ? "解除锁定,恢复显示全部节点"
      : "只看当前节点的相关子图(上游依赖 + 下游后代);锁定后可继续浏览其它节点而视角不变";
  }

  function render() { applyHighlight(); }

  // 背景/节点的统一 click 处理见下方"pan / zoom"区（selectNode）。
  // Esc:先撤标签高亮,还在选中态的话再按一次才取消选中 —— 一次按键撤一层,
  // 比"一键全清"好收手(标签点错了不至于连选中的节点一起丢)。
  HANDLERS.onKeydown = function (e) {
    if (e.key !== "Escape") return;
    if (clearTagLit()) return;
    selectNode(null);
  };
  // 「点别的地方就恢复」。标签自己的 click 里 stopPropagation 了,不会走到这。
  //
  // 例外:**不改变"在看什么"的操作台按钮**(缩放 / 归位 / 重排 / 明暗 / 侧栏 / 锁定)。
  // 严格照"点任何别处都清"来做的话,点亮 69 个节点后想放大看一眼 —— 点了 +,高亮就没了,
  // 那不是"恢复",那是功能坏了。判据是这一下点击有没有换掉当前话题:换节点、点空白、
  // 在面板里点别的东西 = 换了,清;调个视角 = 没换,留着。
  HANDLERS.onDocClick = function (e) {
    if (!state.tagLit) return;
    var t = e.target;
    if (!t || !t.closest) { clearTagLit(); return; }
    if (t.closest("[data-tag-kind]")) return;
    if (t.closest("header, .canvas-toolbar")) return;
    clearTagLit();
  };

  // ---- rendering (static layered positions; no physics/spring) ----
  function draw() {
    GRAPH_DATA.forEach(function (n) {
      // 防御:坐标未定/非有限时跳过该节点,别让一个坏坐标的 toFixed() 抛错拖垮整个 draw()
      // (否则其后所有节点都定位不上、全落 SVG 原点)。
      if (!isFinite(n.x) || !isFinite(n.y)) return;
      nodeEls[n.id].setAttribute("transform", "translate(" + n.x.toFixed(2) + "," + n.y.toFixed(2) + ")");
      var b = blobEls[n.id];
      b.setAttribute("cx", n.x.toFixed(2)); b.setAttribute("cy", n.y.toFixed(2));
    });
    Object.keys(edgeEls).forEach(function (k) {
      var e = edgeEls[k]; var from = byId[e.fromId], to = byId[e.toId];
      if (!from || !to || !isFinite(from.x) || !isFinite(to.x)) return; // 端点坐标未定(隐藏节点)→ 跳过
      // from = 下游(高 level, 偏上/小 y)；to = 上游/依赖(低 level, 偏下/大 y)。
      // 竖向三次贝塞尔，从 from 底边接到 to 顶边，长跨层的边也基本沿竖直、易读。
      var x1 = from.x, y1 = from.y + NODE_R;
      var x2 = to.x, y2 = to.y - NODE_R;
      if (y2 < y1) { y1 = from.y - NODE_R; y2 = to.y + NODE_R; } // 兜底：万一 to 在上方
      var midY = (y1 + y2) / 2;
      e.path.setAttribute("d",
        "M" + x1.toFixed(1) + "," + y1.toFixed(1) +
        " C" + x1.toFixed(1) + "," + midY.toFixed(1) +
        " " + x2.toFixed(1) + "," + midY.toFixed(1) +
        " " + x2.toFixed(1) + "," + y2.toFixed(1));
    });
  }

  // 一次性入场动画：从画布中心展开到各自层里，之后固定、不再抖动
  var animRaf = null;
  function animateTo(dur) {
    if (animRaf) cancelAnimationFrame(animRaf);
    GRAPH_DATA.forEach(function (n) { n.sx = n.x; n.sy = n.y; });
    var t0 = performance.now();
    function step(now) {
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 3); // easeOutCubic，收得住、不回弹
      GRAPH_DATA.forEach(function (n) {
        n.x = n.sx + (n.tx - n.sx) * e;
        n.y = n.sy + (n.ty - n.sy) * e;
      });
      draw();
      if (t < 1) animRaf = requestAnimationFrame(step); else animRaf = null;
    }
    animRaf = requestAnimationFrame(step);
  }
  // relayout：按当前 domain/kind/status 勾选重算可见子集 + 层次布局 → 隐藏落选节点、
  // 只让可见子图重新铺开占满画布 → 重建层带 → 适配视图。这是"隐藏+重排"的统一入口，
  // domain/kind/status 过滤变化、以及 ✦/⤾ 按钮都走它。可逆：重新勾中的 domain 节点从中心飞回。
  function relayout(dur) {
    computeLayout();      // 只用可见节点 + 它们之间的边重算层次布局
    buildLevelBands();    // 层带随新 maxLevel 重建
    updateVisibility();   // 落选节点/边 display:none（彻底移除、不占位）
    if (REDUCED) {
      GRAPH_DATA.forEach(function (n) { if (state.visibleSet[n.id]) { n.x = n.tx; n.y = n.ty; } });
      draw();
    } else {
      animateTo(dur || 620);
    }
    fitToScreen();        // 缩放/居中适配重排后的可见子图
    applyHighlight();
  }

  updateVisibility();
  if (REDUCED) {
    GRAPH_DATA.forEach(function (n) { n.x = n.tx; n.y = n.ty; });
    draw();
  } else {
    draw();
    animateTo(820);
  }
  applyHighlight();

  // ---- pan / zoom / node-drag ----
  var view = { x: 0, y: 0, scale: 1 };
  function applyView() { viewport.setAttribute("transform", "translate(" + view.x + "," + view.y + ") scale(" + view.scale + ")"); }
  // 缩放范围。**一处定义,三处共用**(滚轮 / 按钮 / 双指),再加上 fitToScreen 的下限 ——
  // 这四个地方各写各的正是上一版的 bug:fitToScreen 能缩到 0.046,而滚轮下限卡在 0.3,
  // 于是「⤾ 归位」把大图缩到 0.046 之后,**再往外滚一格会被顶回 0.3** ——
  // 想缩小,结果放大了 6.5 倍,而且从此再也回不到那个全局视图。
  var ZOOM_MIN = 0.02;   // 12696px 宽的合并图在 642px 容器里需要 0.046,留足余量
  var ZOOM_MAX = 2.6;
  function fitToScreen() {
    var r = canvasWrap.getBoundingClientRect();
    // 容器尺寸还没被 flex 布局量出来(初次渲染/隐藏中/DOM 大布局慢)→ rect≈0,
    // 此时算出的 view.x/y 会把图中心映射到屏幕原点 → 全部节点挤左上角。
    // 下一帧重试到容器真有尺寸再适配(修"所有节点堆左上角"根因)。
    if (r.width < 60 || r.height < 60) { requestAnimationFrame(fitToScreen); return; }
    // W×H 已是当前可见子集(含 isolate 补位重排后)的实际范围 → 直接整体适配,isolate 后正好铺满、看得全。
    var sx = (r.width - 60) / W, sy = (r.height - 60) / H;
    // 下限 0.02 —— 这个函数叫「适配屏幕」,它就必须**真的适配**。

// 顶层可选 title：项目自定义左上角标题(缺省保持模板通用的"项目推理图谱")。
function applyTitle(t) {
  if (!t) return;
  var el = document.getElementById("brandTitle");
  if (el) el.textContent = t;
  try { document.title = t + " · DAG"; } catch (e) {}
}

function loadFromYamlText(text) {
  var data = jsyaml.load(text);
  applyTitle(data && data.title);
  boot((data && data.nodes) || []);
}

var _injNodes = Array.isArray(INJECTED) ? INJECTED : ((INJECTED && INJECTED.nodes) || []);
if (_injNodes.length) {
  if (INJECTED && !Array.isArray(INJECTED)) applyTitle(INJECTED.title);
  boot(_injNodes);
} else if (location.search.indexOf("yaml=") !== -1) {
  var u = new URLSearchParams(location.search).get("yaml");
  fetch(u).then(function (r) { return r.text(); }).then(loadFromYamlText)
    .catch(function (err) { console.error("加载 yaml 失败:", err); });
} else {
  showDropZone();
}

function showDropZone() {
  var dz = document.getElementById("dropZone");
  dz.style.display = "flex";
}

// 拖拽监听挂在 document 上、只挂一次：第一次(dropZone 可见时)和之后任意次重新拖入
// 都能命中同一套逻辑，天然支持 re-drop（拖第二个 yaml 换图），不需要额外状态判断。
document.addEventListener("dragover", function (e) { e.preventDefault(); });
document.addEventListener("drop", function (e) {
  e.preventDefault();
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    var dz = document.getElementById("dropZone");
    if (dz) dz.style.display = "none";
    loadFromYamlText(reader.result);
  };
  reader.readAsText(f);
});
