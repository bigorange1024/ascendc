# 推理图谱：ML-KEM Encrypt 卡死排查（初始 W0）
# 工具：thirdparty/reasoning-graph-skill-master/
# 主控独占写；subagent 只读参考（除非任务明示允许改指定节点）
# 入库门禁：只收服务 Encrypt 卡死 debug 的断言；失败实验一等公民；
#   禁止把「严重伤效率/性能却只保 correctness」的反模式当推荐知识沉淀；
#   最终 NPU、迭代 SIM；不沉淀 CPU 孪生经验

version: 1
title: "ML-KEM Encrypt 卡死 · 推理图谱"

review:
  last_reviewed: "2026-09-03"
  note: "服务 debug；失败优先；反模式禁推荐；SIM 关键 / 不沉淀 CPU"

config:
  required_fields: [domain]
  id_prefix_by_kind: {fact: F, inference: J, decision: D, question: Q}
  fact_provenance_values: [observation, measurement, doc, env-api]
  inference_derivation_values: [deductive, defeasible]
  decision_by_values: [human, agent]
  require_repro_for_provenance: [measurement]

nodes:
  # ================= domain: method（工作法；支撑后续实验） =================
  - id: D-admit-debug-only
    domain: method
    kind: decision
    by: human
    title: "图谱只沉淀服务 debug 的知识"
    statement: "节点必须能直接支撑 Encrypt 卡死的定位、证伪或修复判断；无关流程/闲聊/目录索引一律不入库"
    deps: [D-goal-npu]
    status: active

  - id: D-admit-failures-first-class
    domain: method
    kind: decision
    by: human
    title: "失败实验与失败经验必须一等公民入库"
    statement: "证伪的推论标 retracted、回退的方案标 inactive，并写清证据与 retracted_by；禁止只沉淀通过测试的成功路径"
    deps: [D-admit-debug-only]
    status: active

  - id: D-reject-correctness-antipattern
    domain: method
    kind: decision
    by: human
    title: "禁止把严重伤效率性能的 correctness 捷径当推荐知识"
    statement: "逐步外搬 GM、为正确性滥增 Host launch、标量碎写等严重伤开发效率或 NPU 性能的做法，即使偶发对拍绿也不得标为 active 推荐解；仅可作为失败/对照经验以 inactive 或 retracted 留痕"
    deps: [D-admit-debug-only]
    status: active

  - id: D-verify-sim-for-npu
    domain: method
    kind: decision
    by: human
    title: "本排查线以 SIM 为关键代理；不沉淀 CPU 经验"
    statement: "最终验收在 NPU 实机；迭代验证以 SIM 为准。CPU 孪生路径与本卡死无关且无参考价值，不跑作门禁、不写入图谱"
    deps: [D-goal-npu, D-admit-debug-only]
    status: active

  - id: D-sim-enough-before-npu
    domain: method
    kind: decision
    by: human
    title: "SIM 实验充分后再请用户上实机"
    statement: "toy/假说须在 SIM 上充分验证后再请用户拷到 NPU；用户可代跑但无法随时上机；实验目标须能导向消除 Encrypt 卡死，非仅 toy 自洽绿"
    deps: [D-verify-sim-for-npu, D-goal-npu, D-near-toy]
    status: active

  - id: D-solo-subagent-timebox
    domain: method
    kind: decision
    by: human
    title: "同时仅一个 subagent；任务必须时限止损"
    statement: "同时最多一个干活 subagent；禁止并行 SIM；每 TASK 必填 deadline_min/max_retries；超时卡死死循环则 ABORT 并沉淀失败，禁止傻等与无限返工"
    deps: [D-main-subagent, D-admit-failures-first-class]
    status: active

  - id: D-no-autonomous-push
    domain: method
    kind: decision
    by: human
    title: "不得自主 git 推送"
    statement: "主控与 subagent 均不得在无用户当次明确授权时 commit 或 push"
    deps: [D-main-subagent]
    status: active

  - id: D-goal-npu
    domain: method
    kind: decision
    by: human
    title: "最终目标：实机 Encrypt 不在 l18_l19 卡死且正确性通过"
    statement: "NPU 实机上 Encrypt（Encaps 路径）不再卡死在 l18_l19（及同类 MIX 挂点），且输出与 golden/权威交叉一致"
    deps: [F-hang-l18, F-sim-pass-baseline]
    status: active
    targets: [Q-root-cause]

  - id: D-near-toy
    domain: method
    kind: decision
    by: human
    title: "近程：轻量 toy 模仿 Encrypt 任务链"
    statement: "先在 ascendc-tests 新建轻量探针，模仿 Encrypt 任务流骨架（哈希/NTT/INTT/内积/encoding 串接），去掉大量真实哈希算量；不对算法正确性；须在 SIM 上正常结束且明显快于全量 Encaps"
    deps: [D-goal-npu, F-sim-slow-hash, D-reject-correctness-antipattern, D-verify-sim-for-npu]
    status: active
    targets: [Q-toy-repro]

  - id: D-graph-tests
    domain: method
    kind: decision
    by: human
    title: "授权 graph_tests 验证图谱推测"
    statement: "在仓库根目录 graph_tests/ 下为图谱推测写小实验；主控设计实验，subagent 实现与跑测"
    deps: [D-near-toy]
    status: active

  - id: D-main-subagent
    domain: method
    kind: decision
    by: human
    title: "主控管图谱与实验设计；subagent 只干活"
    statement: "主控负责目标、图谱沉淀/刷新/推理、实验设计与结果分析；实现代码由 subagent 按任务模板执行并按反馈模板回报；subagent 默认可读图谱、默认不写图谱"
    deps: [D-graph-tests, D-admit-failures-first-class]
    status: active

  - id: F-sim-slow-hash
    domain: perf
    kind: fact
    provenance: observation
    title: "全量 Encaps SIM 因大量哈希很慢"
    statement: "全量 Encaps SIM 路径含大量 Keccak/SHAKE，单次验证墙钟显著长于轻量探针"
    deps: []
    status: verified
    basis: experiment
    evidence: "用户 2026-09-03 明确；对照 KeyGen/Encrypt 全链 SIM 经验"

  # ================= domain: verify（观测与验收语义） =================
  - id: F-host-print-before-launch
    domain: verify
    kind: fact
    provenance: doc
    title: "Host launch 文案在 ACL 启动之前打印"
    statement: "main_kem_encaps 的 stderr「launch N …」打印在 ACLRT_LAUNCH 之前；「[npu_launch] duration」仅在 SynchronizeStream 返回后打印"
    deps: []
    status: verified
    basis: spec
    evidence: "qa/2026-09/2026-09-03-Encaps-Decaps真2launch与GATE.md §实机续报；main_kem_encaps.cpp"

  - id: F-hang-l18
    domain: verify
    kind: fact
    provenance: measurement
    title: "实机可挂在 l18_l19 Launch/Sync"
    statement: "实机 Encaps 卡死时，最后一行可为「launch 2 f203_encrypt_l18_l19 (ySrc=null)」，且无对应 [npu_launch] duration"
    repro: "F203_L18_TRACE=1 bash run.sh -r npu -v Ascend910B4（stable kem-encaps-k4）"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03；用户实机反馈"

  - id: F-hang-prep-ntt
    domain: verify
    kind: fact
    provenance: measurement
    title: "实机可挂在 prep_ntt Launch/Sync"
    statement: "实机 Encaps 卡死时，最后一行可为「launch 1 f203_kem_enc_prep_ntt」，尚未打印 launch 2"
    repro: "KEM_ENCAPS_FORCE_REBUILD=1 bash run.sh -r npu -v Ascend910B4（多轮）"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03 §实机续报"

  - id: F-hang-split-ntt-y
    domain: verify
    kind: fact
    provenance: measurement
    title: "SPLIT_PREP=1 可挂在 ntt_y"
    statement: "F203_ENCAPS_SPLIT_PREP=1 时，卡死最后一行可为「launch 2 f203_encrypt_ntt_y」"
    repro: "F203_ENCAPS_SPLIT_PREP=1 bash run.sh -r npu -v Ascend910B4"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03 §SPLIT 亦挂"

  - id: F-hang-split-l18
    domain: verify
    kind: fact
    provenance: measurement
    title: "SPLIT_PREP=1 可挂在 l18"
    statement: "F203_ENCAPS_SPLIT_PREP=1 时，卡死最后一行可为「launch 3 f203_encrypt_l18_l19」"
    repro: "F203_ENCAPS_SPLIT_PREP=1 F203_L18_TRACE=1 bash run.sh -r npu -v Ascend910B4"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03"

  - id: F-trace-empty-0-16
    domain: verify
    kind: fact
    provenance: measurement
    title: "挂 l18 时 TRACE stages 全空"
    statement: "F203_L18_TRACE=1 且挂在 l18 时，可见「[l18-trace] stages set=0/16 :」空列表，全程无 FusedTraceMark"
    repro: "F203_L18_TRACE=1 bash run.sh -r npu -v Ascend910B4（挂于 l18）"
    deps: [F-hang-l18]
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03 §TRACE 实锤；AGENT_HANDOFF.md"

  - id: F-clean-tree-hang
    domain: verify
    kind: fact
    provenance: measurement
    title: "删 out* 后仍可复现空 TRACE 挂"
    statement: "删除用例 out 产物与 npu 安装树后，仍可复现 TRACE 0/16 空挂"
    repro: "删用例 out* 后 F203_L18_TRACE=1 bash run.sh -r npu"
    deps: [F-trace-empty-0-16]
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03 §TRACE 实锤"

  - id: F-keygen-no-hang
    domain: verify
    kind: fact
    provenance: observation
    title: "PKE/KEM KeyGen 实机未出现同类卡死"
    statement: "用户带着 agent 做的 PKE KeyGen 路径未出现与 Encrypt 同类的运行卡死"
    deps: []
    status: verified
    basis: experiment
    evidence: "用户 2026-09-03 口述；作对照基线"

  - id: F-sim-pass-baseline
    domain: verify
    kind: fact
    provenance: measurement
    title: "Cloud 默认 2-launch Encaps SIM 对拍绿"
    statement: "回退失败同步实验后，分支默认 prep_ntt|l18 路径在 Cloud 上 SIM_DIRECT sim [verify] PASS"
    repro: "cd stable-…-kem-encaps-k4 && SIM_DIRECT=1 bash run.sh -r sim -v Ascend910B4"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03 §下一步计划；AGENT_HANDOFF.md"

  - id: F-force-vs-old-binary
    domain: verify
    kind: fact
    provenance: observation
    title: "不 FORCE 会复用旧 fused 二进制"
    statement: "run.sh 默认 SKIP_REBUILD 时复用 out_prod_npu 中旧 fused 双 Cube 二进制，可不 FORCE 时表现为必挂"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03 §6"

  - id: F-107002-was-host
    domain: verify
    kind: fact
    provenance: observation
    title: "旧 TRACE 107002 是 Host context 空"
    statement: "SynchronizeStreamMaybeTrace 把 sync 放到未 SetDevice 的子线程会导致 ACL 107002 CONTEXT_NULL，不是 CrossCore 死等证据"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-02；acl_session.hpp 已修"

  - id: F-delete-out-not-sufficient
    domain: verify
    kind: fact
    provenance: observation
    title: "删 out/output 不足以消除粘性"
    statement: "删 out_prod_npu/output 不能可靠消除实机粘性；单卡 reset + 杀残留进程才是设备级恢复手段"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-02 §1"

  # ================= domain: impl（实现约束与组件） =================
  - id: F-syncall-after-aic
    domain: impl
    kind: fact
    provenance: doc
    title: "SyncAll 仅在 AIC 已返回后可用"
    statement: "AscendC SyncAll<isAIVOnly=true> 在 MIX 下仅当 AIC 已返回后用于双 AIV 汇合；AIC 仍 Wait 时调用不合法"
    deps: []
    status: verified
    basis: spec
    evidence: "library/documents/CANN-AscendC算子开发接口参考-查阅索引.md 2026-07-13"

  - id: F-flag-1-3-cube
    domain: impl
    kind: fact
    provenance: doc
    title: "NTT/INTT 使用 CrossCore flag 1/3 与 AIC 握手"
    statement: "Encrypt 路径的 NTT 与 l18 内 INTT 均使用 CrossCore flag 1 与 3 完成 AIV-AIC Cube 握手"
    deps: []
    status: verified
    basis: spec
    evidence: "qa/2026-09/2026-09-03 §SPLIT；既有 l18_l19 / ntt_y 实现"

  - id: F-gate-4-8
    domain: impl
    kind: fact
    provenance: doc
    title: "l18 at_jp 路径另有 GATE flag 4/8"
    statement: "l18(skipNtt) 在 at_jp 之后使用 GATE CrossCore flag 4 与 8，随后进入 INTT"
    deps: []
    status: verified
    basis: spec
    evidence: "qa/2026-09/2026-09-03；Decrypt/Encrypt fused 同构记录"

  - id: F-ntt-y-no-gate
    domain: impl
    kind: fact
    provenance: doc
    title: "ntt_y 核无 GATE、无 at_jp"
    statement: "f203_encrypt_ntt_y 仅含一轮 Cube 的 NTT flag 1/3 握手，不含 GATE 4/8 与 at_jp"
    deps: []
    status: verified
    basis: spec
    evidence: "qa/2026-09/2026-09-03 §SPLIT 亦挂表"

  - id: F-prep-needs-gate-sim
    domain: impl
    kind: fact
    provenance: measurement
    title: "SIM：prep 后开 Cube 前须 GATE"
    statement: "同核 prep 后无 GATE 即开 NTT 时 Cloud SIM 对拍 c 失败；补 SoftSyncArrive 与 GATE 后通过"
    repro: "对比无 GATE prep_ntt vs 有 GATE prep_ntt 再 l18（Cloud SIM）"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03 §3.1–3.2"

  - id: F-prep-mix-only-pass
    domain: impl
    kind: fact
    provenance: measurement
    title: "SIM：PREP_MIX_ONLY 路径曾 PASS"
    statement: "MIX 仅 prep、再独立 ntt_y 与 l18 的诊断路径在 Cloud SIM 对拍 PASS"
    repro: "F203_ENCAPS_PREP_MIX_ONLY=1 bash run.sh -r sim -v Ascend910B4"
    deps: []
    status: verified
    basis: experiment
    evidence: "qa/2026-09/2026-09-03 §3.2"

  # ================= 已证伪 / 已回退（负面知识，必须保留） =================
  - id: J-only-second-l18
    domain: impl
    kind: inference
    derivation: defeasible
    title: "（已证伪）卡死充分条件是仅第二段 l18"
