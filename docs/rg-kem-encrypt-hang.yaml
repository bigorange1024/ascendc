  - id: J-only-dual-cube
    domain: impl
    kind: inference
    derivation: defeasible
    title: "（已证伪）卡死充分条件是同核双 Cube"
    statement: "若充分条件为同核双 Cube，则每 launch 仅一轮 Cube 的默认 2-launch 与单 Cube 的 prep_ntt/ntt_y 不应挂"
    deps: [F-hang-prep-ntt, F-hang-split-ntt-y]
